<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>503 · 服务暂停</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: #fdfefe;
    color: #66ccff;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
  }

  .box { max-width: 520px; width: 100%; text-align: center; }

  .code {
    font-size: clamp(72px, 18vw, 120px);
    font-weight: 900;
    letter-spacing: 6px;
    line-height: 1;
    margin-bottom: 18px;
    color: #66ccff;
  }

  p {
    font-size: 14.5px; line-height: 2; color: #66ccff; margin-bottom: 10px;
    word-break: break-all;
  }
  p b { color: #66ccff; }

  .meta {
    margin-top: 26px; font-size: 11px; color: #66ccff; opacity: .7;
    letter-spacing: 1px; font-family: ui-monospace, Menlo, Consolas, monospace;
  }

  .go {
    display: inline-block;
    margin-top: 32px;
    padding: 11px 30px;
    border: 1.5px solid #66ccff;
    border-radius: 999px;
    background: transparent;
    color: #66ccff;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: .5px;
    text-decoration: none;
    transition: background .18s, transform .18s;
  }
  .go:hover, .go:focus-visible { background: rgba(102, 204, 255, .14); transform: translateY(-1px); }
  .go:active { transform: translateY(0); }

  .lang { margin-top: 18px; font-size: 12px; }
  .lang a { color: #66ccff; opacity: .75; text-decoration: none; }
  .lang a:hover { opacity: 1; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">503</div>
    <p>由于服务框架瘫痪，本站已于<b>公元2026年11月7日20:30</b>停止对外服务，<b>服务恢复时间未知</b>。</p>
    <div class="meta">zrfeng.top · 503 SERVICE UNAVAILABLE</div>
    <a class="go" href="/zh_cn/notice/">前往通知页面</a>
    <p class="lang"><a href="/en_us/down/">English</a></p>
  </div>
</body>
</html>
