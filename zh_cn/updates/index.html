<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>/* 尽早落地主题（默认原生安卓；只认控制台「外观」里存下的值，避免闪色） */(function(){var t='android';try{var s=localStorage.getItem('zrfeng-theme');if(s==='light'||s==='dark'||s==='android')t=s;}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<title>剩余更新清单 · 暂停服务</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: #050807;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(0, 255, 140, 0.07) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(0, 255, 140, 0.05) 0%, transparent 45%);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e8f5ee;
  }

  .box { max-width: 440px; width: 100%; text-align: center; }

  .ico { font-size: 42px; margin-bottom: 16px; opacity: .9; }
  h1 {
    font-size: 22px; margin-bottom: 12px; line-height: 1.4;
    background: linear-gradient(90deg, #ffffff, #00ff8c);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }
  p { font-size: 13.5px; line-height: 1.9; color: #9fb8ab; margin-bottom: 8px; }
  .note {
    font-size: 12px; color: #6d8a7b; margin: 20px 0 22px; line-height: 1.8;
    background: rgba(255, 176, 32, 0.06);
    border: 1px solid rgba(255, 176, 32, 0.18);
    border-radius: 10px; padding: 10px 14px;
  }
  .acts { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-block; padding: 10px 20px; border-radius: 10px;
    font-size: 13px; text-decoration: none;
    border: 1px solid rgba(0, 255, 140, 0.45);
    background: rgba(0, 255, 140, 0.12); color: #00ff8c;
  }
  a.btn.ghost { border-color: rgba(255,255,255,.18); background: transparent; color: #9fb8ab; }
  a.btn:active { filter: brightness(1.3); }
  footer { text-align: center; color: #3d5a4b; font-size: 11px; margin-top: 26px; letter-spacing: 1px; }

  html[data-theme="light"] body { background: #f2f7f3; color: #10231a; }
  html[data-theme="light"] h1 { color: #10231a; }
  html[data-theme="light"] p { color: #5a7a68; }
  html[data-theme="light"] .note {
    color: #6a5a3a; background: rgba(184,134,11,.06); border-color: rgba(184,134,11,.2);
  }
  html[data-theme="light"] a.btn { border-color: rgba(0,145,88,.35); background: rgba(0,145,88,.08); color: #009658; }
  html[data-theme="light"] a.btn.ghost { border-color: rgba(0,0,0,.1); background: transparent; color: #5a7a68; }
  html[data-theme="light"] footer { color: #9aaa98; }
</style>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/android.css">
</head>
<body>
  <div class="box">
    <div class="ico">🚧</div>
    <h1>剩余更新清单暂停服务</h1>
    <p>这个页面正在修复中，暂时关闭。</p>
    <div class="note">
      如果你是通过导航页进来的，说明入口还没撤干净；<br>
      直接输入网址进来的话，请稍后再来。
    </div>
    <div class="acts">
      <a class="btn" href="/zh_cn/guide/">返回导航站</a>
      <a class="btn ghost" href="/zh_cn/">回主站</a>
    </div>
    <footer>zrfeng.top · 剩余更新清单</footer>
    <p style="text-align:center;font-size:12px;margin:16px 0 0"><a href="/en_us/updates/?lang=en" style="color:#7fa893;text-decoration:none">English</a></p>
  </div>
</body>
</html>
