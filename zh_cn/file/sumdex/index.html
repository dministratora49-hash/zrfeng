<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>/* 尽早落地主题（暗色/亮色/原生安卓，切换在顶部状态栏或控制台「外观」里） */(function(){var t='android';try{var s=localStorage.getItem('zrfeng-theme');if(s==='light'||s==='dark'||s==='android')t=s;}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<title>Sumdex · zrfeng.top</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #050807;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0, 255, 140, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0, 255, 140, 0.05) 0%, transparent 50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 80px 24px 24px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e8f5ee;
  }

  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,140,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,140,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .top {
    position: relative;
    text-align: center;
    width: 100%;
    max-width: 820px;
  }

  h1 {
    font-size: 30px;
    margin-bottom: 44px;
    background: linear-gradient(90deg, #ffffff, #00ff8c);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ===== 横排：名称靠左 · 版本居中 · 版权说明靠右 ===== */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 18px;
    flex-wrap: wrap;
    padding: 24px 28px;
    border: 1px solid rgba(0, 255, 140, 0.35);
    border-radius: 16px;
    background: rgba(10, 18, 14, 0.85);
    box-shadow: 0 0 16px rgba(0, 255, 140, 0.1);
  }

  .book {
    font-size: 19px;
    letter-spacing: 2px;
    color: #e8f5ee;
    white-space: nowrap;
  }

  /* 中间的版本号 */
  .ver {
    font-size: 13px;
    letter-spacing: 1px;
    color: #7fa893;
    white-space: nowrap;
    font-family: ui-monospace, Menlo, Consolas, monospace;
  }
  .ver b { color: #00ff8c; font-weight: 700; }

  /* 右侧：版权说明代替下载按钮 */
  .right {
    margin-left: auto;
    max-width: 320px;
    text-align: right;
    font-size: 12.5px;
    line-height: 1.75;
    color: #d8c9a8;
    background: rgba(255, 176, 32, 0.07);
    border: 1px solid rgba(255, 176, 32, 0.22);
    border-radius: 10px;
    padding: 9px 14px;
  }

  /* ===== 返回按钮 ===== */
  .back {
    position: relative;
    margin-top: 34px;
  }
  .back a {
    display: inline-block;
    padding: 11px 36px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #00ff8c;
    text-decoration: none;
    border: 1px solid rgba(0, 255, 140, 0.4);
    border-radius: 8px;
    background: rgba(0, 255, 140, 0.06);
    transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .back a:hover {
    background: rgba(0, 255, 140, 0.14);
    border-color: #00ff8c;
    box-shadow: 0 0 22px rgba(0, 255, 140, 0.3);
  }

  .bottom {
    position: relative;
    text-align: center;
    font-size: 12px;
    color: #4a6a58;
    line-height: 2;
    letter-spacing: 1px;
    margin-top: 48px;
  }

  /* ===== 亮色主题 ===== */
  html[data-theme="light"] body { background: #f2f7f3; color: #10231a; }
  html[data-theme="light"] h1 { color: #10231a; }
  html[data-theme="light"] .row { background: rgba(255,255,255,.9); border-color: rgba(0,145,88,.2); }
  html[data-theme="light"] .book { color: #10231a; }
  html[data-theme="light"] .ver { color: #5a7a68; }
  html[data-theme="light"] .ver b { color: #009658; }
  html[data-theme="light"] .right {
    color: #6a5a3a; background: rgba(184,134,11,.06); border-color: rgba(184,134,11,.22);
  }
  html[data-theme="light"] .back a { border-color: rgba(0,145,88,.35); background: rgba(0,145,88,.08); color: #009658; }
  html[data-theme="light"] .bottom { color: #9aaa98; }

  @media (max-width: 640px) {
    body { padding-top: 56px; }
    h1 { font-size: 23px; margin-bottom: 34px; }
    .row { flex-direction: column; align-items: flex-start; gap: 12px; padding: 20px 18px; }
    .book { font-size: 17px; }
    .right { margin-left: 0; max-width: none; width: 100%; text-align: left; }
    .back a { padding: 10px 28px; }
  }
</style>
<link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="/android.css">
</head>
<body>
  <div class="top">
    <h1>Sumdex</h1>

    <div class="row">
      <span class="book">Sumdex</span>
      <span class="ver">版本：<b>1.0.0-rc1</b></span>
      <span class="right">由于涉及版权问题，该版本的暂时不会公开</span>
    </div>

    <div class="back">
      <a href="/zh_cn/file">← 返回资源库</a>
    </div>
  </div>

  <div class="bottom">
    <div>zrfeng.top</div>
    <div>© 2026 zrfeng.top — All Rights Reserved</div>
  </div>
  <script src="/status.js" defer></script>
<p style="text-align:center;font-size:12px;margin:16px 0"><a href="/en_us/file/sumdex/?lang=en" style="color:#7fa893;text-decoration:none">English</a></p>
</body>
</html>
