<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>/* 尽早落地亮/暗色主题，避免刷新时先闪一下深色（切换按钮在顶部状态栏里） */(function(){var t='dark';try{var s=localStorage.getItem('zrfeng-theme');if(s==='light'||s==='dark')t=s;}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<title>联系我们 · zrfeng.top</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #050807;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0, 255, 140, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0, 255, 140, 0.05) 0%, transparent 50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 80px 24px 24px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e8f5ee;
  }

  /* 网格背景 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,140,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,140,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .top {
    position: relative;
    text-align: center;
    width: 100%;
    max-width: 620px;
  }

  h1 {
    font-size: 36px;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #ffffff, #00ff8c);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.sub {
    color: #7fa893;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 40px;
  }

  /* ===== 分节标题 ===== */
  .sec-title {
    margin-bottom: 16px;
    padding-left: 6px;
    text-align: left;
    font-size: 13px;
    letter-spacing: 2px;
    color: #00ff8c;
  }

  /* ===== 邮箱列表 ===== */
  .list {
    display: flex;
    flex-direction: column;
    gap: 14px;
    text-align: left;
  }

  .item {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    padding: 18px 20px;
    border: 1px solid rgba(0, 255, 140, 0.35);
    border-radius: 16px;
    background: rgba(10, 18, 14, 0.85);
    box-shadow: 0 0 16px rgba(0, 255, 140, 0.1);
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  }
  .item:hover {
    transform: translateY(-2px);
    border-color: #00ff8c;
    box-shadow: 0 0 26px rgba(0, 255, 140, 0.3);
  }

  .addr {
    flex: 1;
    min-width: 0;
    font-size: 14px;
    line-height: 1.5;
    color: #e8f5ee;
    text-decoration: none;
    word-break: break-all;
    transition: color 0.2s;
  }
  .addr:hover { color: #00ff8c; }

  /* 标注：主要 / 回复随缘 */
  .tag {
    flex-shrink: 0;
    padding: 3px 12px;
    font-size: 12px;
    letter-spacing: 1px;
    border-radius: 20px;
    white-space: nowrap;
  }
  .tag.main {
    color: #00ff8c;
    border: 1px solid rgba(0, 255, 140, 0.45);
    background: rgba(0, 255, 140, 0.1);
    box-shadow: 0 0 12px rgba(0, 255, 140, 0.15);
  }
  .tag.casual {
    color: #ffb74d;
    border: 1px solid rgba(255, 183, 77, 0.35);
    background: rgba(255, 183, 77, 0.08);
  }

  .copy {
    flex-shrink: 0;
    padding: 6px 14px;
    font-size: 12px;
    font-family: inherit;
    letter-spacing: 1px;
    color: #7fa893;
    border: 1px solid rgba(0, 255, 140, 0.25);
    border-radius: 20px;
    background: transparent;
    cursor: pointer;
    transition: color 0.2s, border-color 0.2s, background 0.2s;
  }
  .copy:hover {
    color: #00ff8c;
    border-color: rgba(0, 255, 140, 0.6);
    background: rgba(0, 255, 140, 0.08);
  }
  .copy.done {
    color: #00ff8c;
    border-color: #00ff8c;
    background: rgba(0, 255, 140, 0.14);
  }

  /* ===== 提交工单 ===== */
  .sec-title.gap { margin-top: 38px; }

  .ticket {
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding: 18px 20px 20px;
    text-align: left;
    border: 1px solid rgba(0, 255, 140, 0.35);
    border-radius: 16px;
    background: rgba(10, 18, 14, 0.85);
    box-shadow: 0 0 16px rgba(0, 255, 140, 0.1);
  }

  .tk-input {
    width: 100%;
    padding: 12px 14px;
    font-size: 14px;
    font-family: inherit;
    line-height: 1.6;
    color: #e8f5ee;
    background: rgba(5, 8, 7, 0.92);
    border: 1px solid rgba(0, 255, 140, 0.25);
    border-radius: 10px;
    outline: none;
    resize: vertical;
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .tk-input::placeholder { color: #4a6a58; }
  .tk-input:focus {
    border-color: #00ff8c;
    box-shadow: 0 0 14px rgba(0, 255, 140, 0.22);
  }
  .tk-area { min-height: 132px; }

  .tk-send {
    padding: 12px 20px;
    font-size: 14px;
    font-family: inherit;
    font-weight: 700;
    letter-spacing: 2px;
    color: #050807;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #00ff8c, #00d97a);
    cursor: pointer;
    transition: opacity 0.2s, box-shadow 0.2s;
  }
  .tk-send:hover { box-shadow: 0 0 22px rgba(0, 255, 140, 0.45); }
  .tk-send:disabled { opacity: 0.55; cursor: default; box-shadow: none; }

  .tk-msg {
    display: none;
    padding: 10px 14px;
    font-size: 13px;
    line-height: 1.7;
    border-radius: 10px;
    word-break: break-word;
  }
  .tk-msg.show { display: block; }
  .tk-msg.ok {
    color: #00ff8c;
    border: 1px solid rgba(0, 255, 140, 0.4);
    background: rgba(0, 255, 140, 0.08);
  }
  .tk-msg.bad {
    color: #ff8a80;
    border: 1px solid rgba(255, 92, 92, 0.4);
    background: rgba(255, 92, 92, 0.08);
  }

  .tk-tip {
    font-size: 12px;
    line-height: 1.9;
    color: #6c8c7c;
  }

  /* 机器人陷阱：正常用户永远看不到这个框 */
  .tk-hp {
    position: absolute;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
  }

  /* 匿名发送 */
  .tk-anon {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin: 4px 0 14px;
    font-size: 13px;
    color: #4a6a58;
    cursor: pointer;
    line-height: 1.7;
  }
  .tk-anon input {
    flex: none;
    width: 16px;
    height: 16px;
    margin-top: 3px;
    accent-color: #4a8f6a;
  }
  .tk-anon-tip {
    font-size: 11px;
    color: #7f9c8c;
  }

  /* ===== 返回按钮 ===== */
  .back {
    position: relative;
    margin-top: 38px;
  }
  .back a {
    display: inline-block;
    padding: 11px 36px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #00ff8c;
    text-decoration: none;
    border: 1px solid rgba(0, 255, 140, 0.4);
    border-radius: 8px;
    background: rgba(0, 255, 140, 0.06);
    transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .back a:hover {
    background: rgba(0, 255, 140, 0.14);
    border-color: #00ff8c;
    box-shadow: 0 0 22px rgba(0, 255, 140, 0.3);
  }

  .bottom {
    position: relative;
    text-align: center;
    font-size: 12px;
    color: #4a6a58;
    line-height: 2;
    letter-spacing: 1px;
    margin-top: 48px;
  }

  @media (max-width: 520px) {
    body { padding-top: 56px; }
    h1 { font-size: 28px; }
    .item { padding: 16px 16px; gap: 10px; }
    .addr { font-size: 13px; }
  }
</style>

<script>
(function () {
  document.addEventListener('click', function (e) {
    var btn = e.target.closest ? e.target.closest('.copy') : null;
    if (!btn) return;
    var mail = btn.getAttribute('data-mail');
    if (!mail) return;

    function done() {
      var old = btn.textContent;
      btn.textContent = '已复制';
      btn.classList.add('done');
      setTimeout(function () {
        btn.textContent = old;
        btn.classList.remove('done');
      }, 1500);
    }

    /* 优先用剪贴板接口；不可用时回退到旧方式；都失败则提示手动复制 */
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(mail).then(done).catch(fallback);
    } else {
      fallback();
    }

    function fallback() {
      try {
        var ta = document.createElement('textarea');
        ta.value = mail;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.top = '-1000px';
        document.body.appendChild(ta);
        ta.select();
        var ok = document.execCommand('copy');
        document.body.removeChild(ta);
        if (ok) { done(); return; }
      } catch (err) { /* 忽略，走下面的提示 */ }
      btn.textContent = '请长按复制';
      setTimeout(function () { btn.textContent = '复制'; }, 1800);
    }
  });
})();
</script>

<script>
/* ===================== 提交工单 =====================
 * 判定规则和服务端完全一致：本地先拦一次，省一趟网络往返；
 * 服务端还会再判一次（前端可以被绕过，以服务端为准）。
 */
(function () {
  var titleEl = document.getElementById('tkTitle');
  var bodyEl = document.getElementById('tkBody');
  var contactEl = document.getElementById('tkContact');
  var siteEl = document.getElementById('tkSite');
  var anonEl = document.getElementById('tkAnon');
  var sendBtn = document.getElementById('tkSend');
  var msgEl = document.getElementById('tkMsg');
  if (!sendBtn || !msgEl) return;

  var TITLE_MIN = 3;
  var BODY_MIN = 10;

  /** 脚本开始跑的时间：配合服务端判断「是不是机器人秒填秒交」 */
  var START = Date.now();

  /** 字数：去掉空白后按码点算 */
  function charCount(s) {
    return Array.from(String(s == null ? '' : s).replace(/\s+/gu, '')).length;
  }

  /** 里面有没有实际文字（汉字 / 字母 / 假名……） */
  function hasWord(s) {
    return /\p{L}/u.test(String(s == null ? '' : s));
  }

  function show(text, ok) {
    msgEl.textContent = text;
    msgEl.className = 'tk-msg show ' + (ok ? 'ok' : 'bad');
  }

  function localSpam(t, b) {
    if (charCount(t) < TITLE_MIN) {
      return '标题至少要 ' + TITLE_MIN + ' 个字，这条已按垃圾工单销毁，补充后可以重新提交。';
    }
    if (charCount(b) < BODY_MIN) {
      return '正文至少要 ' + BODY_MIN + ' 个字，这条已按垃圾工单销毁，补充后可以重新提交。';
    }
    if (!hasWord(t) || !hasWord(b)) {
      return '标题或正文里没有实际文字（全是数字或标点），这条已按垃圾工单销毁。';
    }
    return '';
  }

  sendBtn.addEventListener('click', function () {
    var t = titleEl.value.trim();
    var b = bodyEl.value.trim();
    var c = contactEl.value.trim();

    if (!t && !b) { show('请填写标题和正文内容', false); return; }

    var spam = localSpam(t, b);
    if (spam) { show(spam, false); return; }

    sendBtn.disabled = true;
    show('正在提交…', true);

    fetch('/api/ticket', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({
        title: t,
        body: b,
        contact: c,
        site: siteEl ? siteEl.value : '',
        elapsedMs: Date.now() - START,
        anonymous: !!(anonEl && anonEl.checked),
      }),
    })
      .then(function (r) { return r.json().catch(function () { return {}; }); })
      .then(function (j) {
        if (j && j.ok) {
          titleEl.value = '';
          bodyEl.value = '';
          contactEl.value = '';
          if (anonEl) anonEl.checked = false;
          // 编号是以后查看回复、继续追问的凭据；回复出现在「通知板块 → 我的消息」
          show(
            (j.message || '工单已提交，我会尽快查看。') +
              (j.id ? '　编号 ' + j.id + '（回复会出现在「通知板块 → 我的消息」里）' : ''),
            true
          );
        } else {
          // 内容太短 / 全是数字标点：服务端已把这条销毁，文字留在框里让人改
          show((j && j.message) || '提交失败，请稍后再试', false);
        }
      })
      .catch(function () { show('网络错误，请稍后再试', false); })
      .then(function () { sendBtn.disabled = false; });
  });
})();
</script>
