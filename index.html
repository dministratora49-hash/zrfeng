<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>www.zrfeng.top主站点</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+SC:wght@300;400;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#080c14;--fg:#e4eaf3;--muted:#4e5f7a;--accent:#00ffaa;--ad:rgba(0,255,170,.1);--ag:rgba(0,255,170,.3);--warm:#ff6b35}
body{font-family:'Noto Sans SC',sans-serif;background:var(--bg);color:var(--fg);min-height:100vh;overflow-x:hidden}
canvas#p{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none}
.atm{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 55% 45% at 18% 22%,rgba(0,255,170,.05) 0%,transparent 70%),radial-gradient(ellipse 45% 55% at 82% 78%,rgba(255,107,53,.03) 0%,transparent 70%)}
.clock-box{position:fixed;top:20px;right:24px;z-index:10;background:rgba(10,16,28,.92);border:1px solid rgba(0,255,170,.12);border-radius:12px;padding:12px 18px;backdrop-filter:blur(12px);text-align:right}
.clock-label{font-size:10px;color:var(--muted);letter-spacing:1.5px;font-family:'Orbitron',monospace;margin-bottom:4px}
.clock-time{font-family:'Orbitron',monospace;font-size:clamp(16px,2.5vw,22px);font-weight:700;color:var(--accent);letter-spacing:1px}
.clock-date{font-family:'Orbitron',monospace;font-size:11px;color:var(--muted);margin-top:3px;letter-spacing:.5px}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:60px 20px 100px}
.badge{display:inline-flex;align-items:center;gap:8px;background:var(--ad);border:1px solid rgba(0,255,170,.15);border-radius:30px;padding:7px 18px;font-family:'Orbitron',monospace;font-size:12px;color:var(--accent);letter-spacing:1.5px;margin-bottom:24px}
h1{font-size:clamp(32px,6vw,58px);font-weight:900;line-height:1.15;margin-bottom:16px;background:linear-gradient(135deg,var(--fg) 40%,var(--accent));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sub{font-size:16px;color:var(--muted);font-weight:300;line-height:1.7;margin-bottom:48px;max-width:560px}
.card{background:rgba(10,16,28,.9);border:1px solid rgba(0,255,170,.1);border-radius:16px;padding:36px;margin-bottom:28px;backdrop-filter:blur(10px);transition:border-color .3s,box-shadow .3s}
.card:hover{border-color:rgba(0,255,170,.25);box-shadow:0 0 30px rgba(0,255,170,.06)}
.card-label{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:2px;margin-bottom:20px;font-family:'Orbitron',monospace}
.card-label i{font-size:14px}
.news-date{display:inline-block;background:rgba(255,107,53,.12);color:var(--warm);font-size:12px;padding:4px 12px;border-radius:20px;margin-bottom:14px;font-weight:700}
.news-text{font-size:18px;line-height:1.8;font-weight:400}
.news-text strong{color:var(--accent);font-weight:700}
.visitor-num{font-family:'Orbitron',monospace;font-size:clamp(48px,8vw,80px);font-weight:900;color:var(--accent);text-shadow:0 0 40px var(--ag);line-height:1;margin:10px 0 6px}
.visitor-sub{font-size:14px;color:var(--muted)}
.timer-tag{display:inline-block;font-size:11px;font-weight:700;letter-spacing:1.5px;padding:3px 10px;border-radius:6px;margin-bottom:14px;font-family:'Orbitron',monospace;background:rgba(0,255,170,.1);color:var(--accent)}
.timer-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.timer-item{text-align:center;background:rgba(0,255,170,.04);border:1px solid rgba(0,255,170,.08);border-radius:12px;padding:14px 4px}
.timer-val{font-family:'Orbitron',monospace;font-size:clamp(22px,4vw,34px);font-weight:700;color:var(--fg);line-height:1.2}
.timer-unit{font-size:11px;color:var(--muted);margin-top:5px;letter-spacing:1px}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;animation:pls 2s ease infinite;margin-right:6px}
@keyframes pls{0%,100%{opacity:1;box-shadow:0 0 0 0 var(--ag)}50%{opacity:.6;box-shadow:0 0 0 8px transparent}}
.fade{animation:fd .8s ease both}
.fade2{animation:fd .8s .2s ease both}
.fade3{animation:fd .8s .4s ease both}
@keyframes fd{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.line{height:1px;background:linear-gradient(90deg,transparent,rgba(0,255,170,.15),transparent);margin:10px 0 20px}
.btn-nav{display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,rgba(0,255,170,.15),rgba(0,255,170,.05));border:1px solid rgba(0,255,170,.3);color:var(--accent);font-size:15px;font-weight:700;font-family:'Noto Sans SC',sans-serif;padding:14px 32px;border-radius:40px;cursor:pointer;text-decoration:none;letter-spacing:1px;transition:all .3s ease;box-shadow:0 0 20px rgba(0,255,170,.08)}
.btn-nav:hover{background:linear-gradient(135deg,rgba(0,255,170,.25),rgba(0,255,170,.08));box-shadow:0 0 35px rgba(0,255,170,.2);transform:translateY(-2px)}
.btn-nav:active{transform:translateY(0)}
.btn-nav i{transition:transform .3s ease}
.btn-nav:hover i{transform:translateX(4px)}
.btn-wrap{text-align:center;margin-top:20px}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:40px;letter-spacing:1px}
@media(max-width:520px){.timer-grid{grid-template-columns:repeat(3,1fr)}.clock-box{top:12px;right:12px;padding:8px 12px}}
</style>
</head>
<body>
<canvas id="p"></canvas>
<div class="atm"></div>
<div class="clock-box">
  <div class="clock-label">NOW</div>
  <div class="clock-time" id="now-time">--:--:--</div>
  <div class="clock-date" id="now-date">----/--/--</div>
</div>
<div class="wrap">
  <div class="badge fade"><i class="fas fa-globe"></i> ZRFENG.TOP</div>
  <h1 class="fade">www.zrfeng.top<br>主站点</h1>
  <p class="sub fade2">欢迎来到本站，这里是信息发布与资源汇聚的中心枢纽。</p>

  <div class="card fade2">
    <div class="card-label"><i class="fas fa-broadcast-tower"></i> 站点公告</div>
    <div class="line"></div>
    <div class="news-date">2026-09-24 08:00</div>
    <p class="news-text">www.zrfeng.top主站已于<strong>2026年9月24日上午8点整</strong>正式成立，感谢您的访问与支持！</p>
  </div>

  <div class="card fade3">
    <div class="card-label"><i class="fas fa-chart-line"></i> 访客统计</div>
    <div class="line"></div>
    <p class="visitor-sub">您是本站的第</p>
    <div class="visitor-num" id="vc">...</div>
    <p class="visitor-sub">位访客</p>
  </div>

  <div class="card fade3">
    <div class="card-label"><span class="pulse"></span><i class="fas fa-stopwatch"></i> 运行状态</div>
    <div class="line"></div>
    <p style="font-size:14px;color:var(--muted);margin-bottom:22px">截止目前本站已正常运行</p>
    <div class="timer-tag">北京时间 (CST +8)</div>
    <div class="timer-grid">
      <div class="timer-item"><div class="timer-val" id="ty">0</div><div class="timer-unit">年</div></div>
      <div class="timer-item"><div class="timer-val" id="tmo">0</div><div class="timer-unit">月</div></div>
      <div class="timer-item"><div class="timer-val" id="td">0</div><div class="timer-unit">日</div></div>
      <div class="timer-item"><div class="timer-val" id="th">0</div><div class="timer-unit">时</div></div>
      <div class="timer-item"><div class="timer-val" id="tmi">0</div><div class="timer-unit">分</div></div>
      <div class="timer-item"><div class="timer-val" id="ts">0</div><div class="timer-unit">秒</div></div>
    </div>
  </div>

  <div class="btn-wrap">
    <a class="btn-nav" href="https://www.zrfeng.top/guide">前往导航站 <i class="fas fa-arrow-right"></i></a>
  </div>

  <footer>&copy; 2026 zrfeng.top &mdash; All Rights Reserved</footer>
</div>

<script>
(function(){
  var c=document.getElementById("p"),ctx=c.getContext("2d"),pts=[];
  function rs(){c.width=innerWidth;c.height=innerHeight}
  rs();window.addEventListener("resize",rs);
  for(var i=0;i<90;i++)pts.push({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.5+.5,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3,a:Math.random()*.4+.1});
  (function draw(){
    ctx.clearRect(0,0,c.width,c.height);
    for(var i=0;i<pts.length;i++){
      var p=pts[i];p.x+=p.vx;p.y+=p.vy;
      if(p.x<0)p.x=c.width;if(p.x>c.width)p.x=0;if(p.y<0)p.y=c.height;if(p.y>c.height)p.y=0;
      ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle="rgba(0,255,170,"+p.a+")";ctx.fill();
    }
    for(var i=0;i<pts.length;i++){for(var j=i+1;j<pts.length;j++){var dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,d=dx*dx+dy*dy;if(d<18000){ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.strokeStyle="rgba(0,255,170,"+((1-d/18000)*.06)+")";ctx.stroke();}}}
    requestAnimationFrame(draw);
  })();
})();

(function(){
  var el=document.getElementById("vc");
  fetch("https://abacus.jasoncameron.dev/hit/zrfengtop/visits")
    .then(function(r){return r.json()})
    .then(function(d){
      if(d&&d.value!==undefined){
        var cur=0,target=d.value;
        (function count(){
          if(cur<target){cur+=Math.max(1,Math.ceil((target-cur)/12));if(cur>target)cur=target;el.textContent=cur.toLocaleString();requestAnimationFrame(count)}
          else{el.textContent=target.toLocaleString()}
        })();
      }else{el.textContent="--"}
    })
    .catch(function(){el.textContent="--"});
})();

(function(){
  var startEpoch=Date.UTC(2026,8,24,0,0,0);
  function tick(){
    var diff=Date.now()-startEpoch;
    if(diff<0){document.getElementById("ty").textContent=0;document.getElementById("tmo").textContent=0;document.getElementById("td").textContent=0;document.getElementById("th").textContent=0;document.getElementById("tmi").textContent=0;document.getElementById("ts").textContent=0;return}
    var ts=Math.floor(diff/1000),s=ts%60,tm=Math.floor(ts/60),m=tm%60,th=Math.floor(tm/60),h=th%24,td=Math.floor(th/24);
    var y=Math.floor(td/365),r=td-y*365,mo=Math.floor(r/30),d=r-mo*30;
    document.getElementById("ty").textContent=y;
    document.getElementById("tmo").textContent=mo;
    document.getElementById("td").textContent=d;
    document.getElementById("th").textContent=h;
    document.getElementById("tmi").textContent=m;
    document.getElementById("ts").textContent=s;
  }
  tick();setInterval(tick,1000);
})();

(function(){
  function pad(n){return n<10?"0"+n:n}
  function update(){
    var now=new Date();
    document.getElementById("now-time").textContent=pad(now.getHours())+":"+pad(now.getMinutes())+":"+pad(now.getSeconds());
    document.getElementById("now-date").textContent=now.getFullYear()+"/"+pad(now.getMonth()+1)+"/"+pad(now.getDate());
  }
  update();setInterval(update,1000);
})();
</script>
</body>
</html>
