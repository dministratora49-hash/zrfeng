<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>赞助页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(0, 255, 140, 0.06), transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(0, 255, 140, 0.04), transparent 50%),
      #050a07;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 15vh;
    font-family: "Microsoft YaHei", sans-serif;
    position: relative;
    overflow-x: hidden;
  }

  /* 网格背景 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 255, 140, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 140, 0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
  }

  h1 {
    color: #00ff88;
    font-size: 26px;
    text-shadow: 0 0 18px rgba(0, 255, 136, 0.7), 0 0 40px rgba(0, 255, 136, 0.35);
    margin-bottom: 14px;
    letter-spacing: 2px;
  }

  .sub {
    color: rgba(200, 255, 220, 0.55);
    font-size: 13px;
    margin-bottom: 40px;
  }

  .cards {
    display: flex;
    gap: 18px;
  }

  .card {
    width: 140px;
    padding: 22px 14px;
    text-align: center;
    background: rgba(0, 20, 10, 0.55);
    border: 1px solid rgba(0, 255, 140, 0.35);
    border-radius: 12px;
    box-shadow: 0 0 18px rgba(0, 255, 136, 0.12), inset 0 0 12px rgba(0, 255, 136, 0.05);
    cursor: pointer;
    text-decoration: none;
    display: block;
    transition: box-shadow 0.25s, border-color 0.25s, transform 0.25s;
  }

  .card:hover {
    border-color: rgba(0, 255, 140, 0.8);
    box-shadow: 0 0 26px rgba(0, 255, 136, 0.3), inset 0 0 12px rgba(0, 255, 136, 0.08);
    transform: translateY(-2px);
  }

  .card .name {
    color: #d7ffe9;
    font-size: 15px;
    margin-bottom: 10px;
  }

  .card .cn {
    color: rgba(200, 255, 220, 0.6);
    font-size: 12px;
    margin-bottom: 12px;
  }

  .status {
    font-size: 11px;
    color: #ff5555;
    text-shadow: 0 0 10px rgba(255, 60, 60, 0.6);
  }

  .status::before {
    content: "●";
    margin-right: 5px;
    animation: blink 1.4s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  /* GitHub 卡片 */
  .github-card {
    margin-top: 46px;
    width: 200px;
    padding: 20px 14px;
    text-align: center;
    background: rgba(0, 20, 10, 0.55);
    border: 1px solid rgba(0, 255, 140, 0.35);
    border-radius: 12px;
    box-shadow: 0 0 18px rgba(0, 255, 136, 0.12), inset 0 0 12px rgba(0, 255, 136, 0.05);
    cursor: pointer;
    text-decoration: none;
    display: block;
    transition: box-shadow 0.25s, border-color 0.25s, transform 0.25s;
  }

  .github-card:hover {
    border-color: rgba(0, 255, 140, 0.8);
    box-shadow: 0 0 26px rgba(0, 255, 136, 0.3), inset 0 0 12px rgba(0, 255, 136, 0.08);
    transform: translateY(-2px);
  }

  .github-card .star {
    font-size: 22px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.6));
  }

  .github-card .text {
    color: #d7ffe9;
    font-size: 14px;
    margin-bottom: 8px;
  }

  .github-card .name {
    color: rgba(200, 255, 220, 0.6);
    font-size: 13px;
    margin-bottom: 10px;
  }

  /* 绿色在线状态 */
  .online {
    font-size: 11px;
    color: #00ff88;
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
  }

  .online::before {
    content: "●";
    margin-right: 5px;
    animation: blink 1.4s infinite;
  }

  /* 返回按钮 */
  .back-btn {
    margin-top: 46px;
    padding: 10px 36px;
    font-size: 14px;
    color: #00ff88;
    background: rgba(0, 255, 140, 0.06);
    border: 1px solid rgba(0, 255, 140, 0.5);
    border-radius: 8px;
    text-decoration: none;
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
    box-shadow: 0 0 14px rgba(0, 255, 136, 0.12);
    transition: box-shadow 0.25s, border-color 0.25s, background 0.25s;
  }

  .back-btn:hover {
    background: rgba(0, 255, 140, 0.14);
    border-color: rgba(0, 255, 140, 0.9);
    box-shadow: 0 0 22px rgba(0, 255, 136, 0.35);
  }
</style>
</head>
<body>

  <h1>选择赞助方式</h1>
  <div class="sub">感谢您的支持！</div>

  <div class="cards">
    <a class="card" href="https://www.zrfeng.top/sponsorship/wechatpay/">
      <div class="name">WeChatPay</div>
      <div class="cn">微信支付</div>
      <div class="status">正在维护</div>
    </a>
    <a class="card" href="https://www.zrfeng.top/sponsorship/alipay/">
      <div class="name">AliPay</div>
      <div class="cn">支付宝支付</div>
      <div class="status">正在维护</div>
    </a>
  </div>

  <a class="github-card" href="https://github.com/dministratora49-hash/zrfeng/tree/main" target="_blank" rel="noopener">
    <div class="star">⭐</div>
    <div class="text">为我的仓库点一个 Star</div>
    <div class="name">GitHub</div>
    <div class="online">在线</div>
  </a>

  <a class="back-btn" href="https://www.zrfeng.top/guide">返回</a>

</body>
</html>
