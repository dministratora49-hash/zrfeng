<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>/* 尽早落地亮/暗色主题，避免刷新时先闪一下深色（切换按钮在顶部状态栏里） */(function(){var t='dark';try{var s=localStorage.getItem('zrfeng-theme');if(s==='light'||s==='dark')t=s;}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<title>Files · zrfeng.top</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #050807;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0, 255, 140, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0, 255, 140, 0.05) 0%, transparent 50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 80px 24px 24px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e8f5ee;
  }

  /* 网格背景 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,140,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,140,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .top {
    position: relative;
    text-align: center;
    width: 100%;
    max-width: 820px;
  }

  h1 {
    font-size: 36px;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #ffffff, #00ff8c);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.sub {
    color: #7fa893;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 40px;
  }

  /* ===== 资源卡片 ===== */
  .boxes {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .box {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 140px;
    height: 140px;
    border: 1px solid rgba(0, 255, 140, 0.35);
    border-radius: 16px;
    background: rgba(10, 18, 14, 0.85);
    text-decoration: none;
    color: #e8f5ee;
    box-shadow: 0 0 16px rgba(0, 255, 140, 0.1);
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  }
  .box:hover {
    transform: translateY(-3px);
    border-color: #00ff8c;
    box-shadow: 0 0 28px rgba(0, 255, 140, 0.4);
  }
  .box .label { font-size: 16px; letter-spacing: 1px; }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #00ff8c;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #00ff8c;
    box-shadow: 0 0 8px #00ff8c;
    animation: blink 1.5s infinite;
  }

  @keyframes blink { 50% { opacity: 0.3; } }

  /* ===== 返回按钮 ===== */
  .back {
    position: relative;
    margin-top: 44px;
  }
  .back a {
    display: inline-block;
    padding: 11px 36px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #00ff8c;
    text-decoration: none;
    border: 1px solid rgba(0, 255, 140, 0.4);
    border-radius: 8px;
    background: rgba(0, 255, 140, 0.06);
    transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .back a:hover {
    background: rgba(0, 255, 140, 0.14);
    border-color: #00ff8c;
    box-shadow: 0 0 22px rgba(0, 255, 140, 0.3);
  }

  .bottom {
    position: relative;
    text-align: center;
    font-size: 12px;
    color: #4a6a58;
    line-height: 2;
    letter-spacing: 1px;
    margin-top: 48px;
  }

  @media (max-width: 520px) {
    body { padding-top: 56px; }
    h1 { font-size: 28px; }
  }
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
  <div class="top">
    <h1>Files</h1>
    <p class="sub">Hand-picked tools and links, still being organized</p>

    <!-- 资源列表：以后添加资源时，复制下面的 <a class="box"> 整块即可 -->
    <div class="boxes">
      <a class="box" href="/en_us/file/novel/">
        <span class="label">Novels</span>
        <span class="status"><span class="dot"></span>Online</span>
      </a>
    </div>

    <div class="back">
      <a href="/en_us/guide/">← Back to Directory</a>
    </div>
  </div>

  <div>
    <div class="bottom">
      <div>zrfeng.top</div>
      <div>© 2026 zrfeng.top — All Rights Reserved</div>
    </div>
  </div>
  <script src="/en_us/status.js" defer></script>
  <p style="text-align:center;font-size:12px;margin:16px 0"><a href="/zh_cn/file/?lang=zh" style="color:#7fa893;text-decoration:none">中文</a></p>
</body>
</html>
