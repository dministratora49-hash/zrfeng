<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>/* 尽早落地亮/暗色主题，避免刷新时先闪一下深色（切换按钮在顶部状态栏里） */(function(){var t='dark';try{var s=localStorage.getItem('zrfeng-theme');if(s==='light'||s==='dark')t=s;}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<title>Romance novels · zrfeng.top</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #050807;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0, 255, 140, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0, 255, 140, 0.05) 0%, transparent 50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 80px 24px 24px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e8f5ee;
  }

  /* 网格背景 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,140,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,140,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .top {
    position: relative;
    text-align: center;
    width: 100%;
    max-width: 820px;
  }

  h1 {
    font-size: 30px;
    margin-bottom: 44px;
    background: linear-gradient(90deg, #ffffff, #00ff8c);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ===== 作品横排：书名靠左，状态与下载靠右 ===== */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 24px 28px;
    border: 1px solid rgba(0, 255, 140, 0.35);
    border-radius: 16px;
    background: rgba(10, 18, 14, 0.85);
    box-shadow: 0 0 16px rgba(0, 255, 140, 0.1);
  }

  .book {
    font-size: 19px;
    letter-spacing: 2px;
    color: #e8f5ee;
  }

  /* 右侧一组：状态 + 下载 */
  .row .right {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-left: auto;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #00ff8c;
    white-space: nowrap;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #00ff8c;
    box-shadow: 0 0 8px #00ff8c;
    animation: blink 1.5s infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }

  .dl-btn {
    display: inline-block;
    padding: 9px 30px;
    font-size: 14px;
    font-family: inherit;
    letter-spacing: 2px;
    color: #00ff8c;
    border: 1px solid rgba(0, 255, 140, 0.5);
    border-radius: 8px;
    background: rgba(0, 255, 140, 0.08);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .dl-btn:hover {
    background: rgba(0, 255, 140, 0.16);
    border-color: #00ff8c;
    box-shadow: 0 0 20px rgba(0, 255, 140, 0.3);
  }

  /* ===== 返回按钮 ===== */
  .back {
    position: relative;
    margin-top: 34px;
  }
  .back a {
    display: inline-block;
    padding: 11px 36px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #00ff8c;
    text-decoration: none;
    border: 1px solid rgba(0, 255, 140, 0.4);
    border-radius: 8px;
    background: rgba(0, 255, 140, 0.06);
    transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .back a:hover {
    background: rgba(0, 255, 140, 0.14);
    border-color: #00ff8c;
    box-shadow: 0 0 22px rgba(0, 255, 140, 0.3);
  }

  /* ===== 弹窗 ===== */
  .mask {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(3px);
  }
  .mask.on { display: flex; }

  .modal {
    width: 100%;
    max-width: 320px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    padding: 30px 26px 24px;
    text-align: center;
    border: 1px solid rgba(0, 255, 140, 0.35);
    border-radius: 16px;
    background: #0a120e;
    box-shadow: 0 0 40px rgba(0, 255, 140, 0.18);
    animation: pop 0.22s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal .head {
    font-size: 13px;
    letter-spacing: 2px;
    color: #7fa893;
    margin-bottom: 20px;
  }

  .need-login {
    padding: 20px 14px;
    text-align: center;
    border: 1px dashed rgba(0, 255, 140, 0.3);
    border-radius: 12px;
    background: rgba(0, 255, 140, 0.04);
  }
  .need-login .nl-text {
    font-size: 13px;
    color: #a9c6b8;
    margin-bottom: 14px;
    letter-spacing: 1px;
  }
  .need-login .nl-btn {
    display: inline-block;
    padding: 9px 24px;
    font-size: 13px;
    letter-spacing: 1px;
    color: #050807;
    font-weight: 700;
    text-decoration: none;
    background: linear-gradient(90deg, #00ff8c, #00d97a);
    border-radius: 8px;
    transition: box-shadow 0.25s;
  }
  .need-login .nl-btn:hover { box-shadow: 0 0 20px rgba(0, 255, 140, 0.45); }

  /* 站内直接下载卡片 */
  .file-card {
    display: flex; flex-direction: column; gap: 10px;
    padding: 18px 16px; border-radius: 14px;
    border: 1px solid rgba(0, 255, 140, 0.35);
    background: rgba(10, 18, 14, 0.85);
  }
  .file-card .fc-name { font-size: 15px; color: #e8f5ee; word-break: break-all; }
  .file-card .fc-meta { font-size: 12px; color: #7fa893; }
  .file-card .fc-btn {
    display: block; text-align: center; padding: 12px 0; border-radius: 10px;
    background: linear-gradient(135deg, #00ff8c, #00c96e); color: #04140c;
    font-weight: 700; text-decoration: none; font-size: 15px;
    box-shadow: 0 0 22px rgba(0, 255, 140, 0.3);
  }
  .file-card .fc-btn:hover { box-shadow: 0 0 30px rgba(0, 255, 140, 0.5); }

  .close {
    display: inline-block;
    margin-top: 18px;
    padding: 8px 26px;
    font-size: 13px;
    font-family: inherit;
    letter-spacing: 1px;
    color: #7fa893;
    border: 1px solid rgba(0, 255, 140, 0.2);
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    transition: color 0.25s, border-color 0.25s;
  }
  .close:hover { color: #e8f5ee; border-color: rgba(0, 255, 140, 0.5); }

  /* ===== 底部 ===== */
  .bottom {
    position: relative;
    text-align: center;
    font-size: 12px;
    color: #4a6a58;
    line-height: 2;
    letter-spacing: 1px;
    margin-top: 48px;
  }

  @media (max-width: 520px) {
    body { padding-top: 56px; }
    h1 { font-size: 23px; margin-bottom: 34px; }
    .row { gap: 12px; padding: 20px 18px; }
    .book { font-size: 17px; }
    .row .right { gap: 14px; }
    .dl-btn { padding: 8px 22px; letter-spacing: 1px; }
    .back a { padding: 10px 28px; }
  }
</style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
  <div class="top">
    <h1>This is the Romance novels section</h1>

    <div class="row">
      <span class="book">"Listening to the Tide"</span>
      <span class="right">
        <span class="status"><span class="dot"></span>Available for download</span>
        <button class="dl-btn" id="dlBtn" type="button">Download</button>
      </span>
    </div>

    <div class="back">
      <a href="/en_us/file/novel/">← Back to Novels</a>
    </div>
  </div>

  <div class="bottom">
    <div>zrfeng.top</div>
    <div>© 2026 zrfeng.top — All Rights Reserved</div>
  </div>

  <!-- 下载弹窗：站内直接下载（服务端校验登录，源码里没有任何下载地址） -->
  <div class="mask" id="mask">
    <div class="modal">
      <div class="head">Download "Listening to the Tide"</div>
      <div id="dlBody">
        <div class="loading">Checking download permission…</div>
      </div>
      <button class="close" id="closeBtn" type="button">Close</button>
    </div>
  </div>

<script>
(function () {
  var SITE = 'https://www.zrfeng.top';
  var mask = document.getElementById('mask');
  var dlBtn = document.getElementById('dlBtn');
  var closeBtn = document.getElementById('closeBtn');
  var listEl = document.getElementById('dlBody');
  var loaded = false;

  function open() { mask.classList.add('on'); if (!loaded) load(); }
  function close() { mask.classList.remove('on'); }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function fmtSize(n) {
    n = Number(n) || 0;
    if (n >= 1048576) return (n / 1048576).toFixed(1) + ' MB';
    if (n >= 1024) return Math.round(n / 1024) + ' KB';
    return n + ' B';
  }

  /** 未登录 / 无权限时的引导块 */
  function notice(text, withLogin) {
    listEl.innerHTML =
      '<div class="need-login">' +
        '<div class="nl-text">' + esc(text) + '</div>' +
        (withLogin ? '<a class="nl-btn" href="/en_us/login/">Go to Log in / Sign up</a>' : '') +
      '</div>';
  }

  /** 有权限：给出直接下载入口 */
  function renderDownload(file) {
    listEl.innerHTML =
      '<div class="file-card">' +
        '<div class="fc-name">📖 ' + esc(file.name || 'Listening to the Tide') + '</div>' +
        '<div class="fc-meta">' + (file.size ? fmtSize(file.size) + ' · ' : '') + 'Log in required · Direct download on site</div>' +
        '<a class="fc-btn" href="' + SITE + '/api/novel/download" rel="noopener">Download now</a>' +
      '</div>';
  }

  async function load() {
    listEl.innerHTML = '<div class="loading">Checking download permission…</div>';
    try {
      var res = await fetch(SITE + '/api/downloads', {
        credentials: 'same-origin',
        headers: { accept: 'application/json' }
      });
      var data = await res.json();

      if (res.status === 401 || data.needLogin) {
        loaded = false;
        notice(data.message || 'Log in to download directly', true);
        return;
      }
      if (data.banned) {
        loaded = true;
        notice(data.message || 'This account has been banned. Please contact the admin.', false);
        return;
      }
      if (data.blocked) {
        loaded = true;
        notice(data.message || 'The trial period of this account has ended. Please contact the admin to activate it.', false);
        return;
      }
      if (!data.ok) throw new Error(data.message || 'Failed to load');

      loaded = true;
      if (!data.file || !data.file.available) {
        notice('The file has not been uploaded yet. Please contact the admin.', false);
        return;
      }
      renderDownload(data.file);
    } catch (e) {
      listEl.innerHTML =
        '<div class="need-login"><div class="nl-text">Failed to load. Please try again later.</div>' +
        '<a class="nl-btn" href="/en_us/login/">Go to Log in</a></div>';
    }
  }

  dlBtn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);

  /* 点击遮罩空白处关闭 */
  mask.addEventListener('click', function (e) {
    if (e.target === mask) close();
  });

  /* 按 Esc 关闭 */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
  });
})();
</script>
  <script src="/en_us/status.js" defer></script>
  <p style="text-align:center;font-size:12px;margin:16px 0"><a href="/file/novel/romancenovel/?lang=zh" style="color:#7fa893;text-decoration:none">中文</a></p>
</body>
</html>
