<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>503 · Service Unavailable</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: #fdfefe;
    color: #66ccff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .box { max-width: 520px; width: 100%; text-align: center; }

  .code {
    font-size: clamp(72px, 18vw, 120px);
    font-weight: 900;
    letter-spacing: 6px;
    line-height: 1;
    margin-bottom: 18px;
    color: #66ccff;
  }

  p {
    font-size: 14.5px; line-height: 2; color: #66ccff; margin-bottom: 10px;
    word-break: break-word;
  }
  p b { color: #66ccff; }

  .poem {
    margin-top: 26px;
    font-size: 16px;
    line-height: 2;
    color: #66ccff;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
  }
  .poem .author {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: .7;
    font-style: normal;
  }

  .meta {
    margin-top: 26px; font-size: 11px; color: #66ccff; opacity: .7;
    letter-spacing: 1px; font-family: ui-monospace, Menlo, Consolas, monospace;
  }

  .go {
    display: inline-block;
    margin-top: 32px;
    padding: 11px 30px;
    border: 1.5px solid #66ccff;
    border-radius: 999px;
    background: transparent;
    color: #66ccff;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: .5px;
    text-decoration: none;
    transition: background .18s, transform .18s;
  }
  .go:hover, .go:focus-visible { background: rgba(102, 204, 255, .14); transform: translateY(-1px); }
  .go:active { transform: translateY(0); }

  .lang { margin-top: 18px; font-size: 12px; }
  .lang a { color: #66ccff; opacity: .75; text-decoration: none; }
  .lang a:hover { opacity: 1; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">503</div>
    <p>Migrating and backing up account data. Preparing to restart.</p>
    <div class="poem">
      If you have a friend who knows your heart, distance cannot keep you two apart.
      <span class="author">— Wang Bo, "Farewell to Prefect Du"</span>
    </div>
    <div class="meta">zrfeng.top · 503 SERVICE UNAVAILABLE</div>
    <a class="go" href="/en_us/notice/">Go to Notice Page</a>
    <p class="lang"><a href="/zh_cn/down/">中文</a></p>
  </div>
</body>
</html>
