<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>/* Apply the saved theme (dark / light / Android) as early as possible; default is Android */(function(){var t='android';try{var s=localStorage.getItem('zrfeng-theme');if(s==='light'||s==='dark'||s==='android')t=s;}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
<title>503 · Service Unavailable</title>
<style>
  /* Roboto（Apache-2.0），和 android.css 里同一份文件 */
  @font-face {
    font-family: 'RobotoM3';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('/assets/fonts/roboto-latin-ext.woff2') format('woff2');
    unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF,
                   U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF,
                   U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;
  }
  @font-face {
    font-family: 'RobotoM3';
    font-style: normal;
    font-weight: 100 900;
    font-display: swap;
    src: url('/assets/fonts/roboto-latin.woff2') format('woff2');
    unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
                   U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122,
                   U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: #fdfefe;
    color: #66ccff;
    font-family: 'RobotoM3', 'Roboto', 'Noto Sans', system-ui, -apple-system, "Segoe UI", sans-serif;
  }

  .box { max-width: 520px; width: 100%; text-align: center; }

  .code {
    font-size: clamp(72px, 18vw, 120px);
    font-weight: 900;
    letter-spacing: 6px;
    line-height: 1;
    margin-bottom: 18px;
    color: #66ccff;
  }

  p {
    font-size: 14.5px; line-height: 2; color: #66ccff; margin-bottom: 10px;
    word-break: break-word;
  }
  p b { color: #66ccff; }

  .poem {
    margin-top: 26px;
    font-size: 16px;
    line-height: 2;
    color: #66ccff;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
  }
  .poem .author {
    display: block;
    margin-top: 6px;
    font-size: 12px;
    letter-spacing: 1px;
    opacity: .7;
    font-style: normal;
  }

  .meta {
    margin-top: 26px; font-size: 11px; color: #66ccff; opacity: .7;
    letter-spacing: 1px;
  }

  .go {
    display: inline-block;
    margin-top: 32px;
    padding: 11px 30px;
    border: 1.5px solid #66ccff;
    border-radius: 999px;
    background: transparent;
    color: #66ccff;
    font-size: 14.5px;
    font-weight: 700;
    letter-spacing: .5px;
    text-decoration: none;
    transition: background .18s, transform .18s;
  }
  .go:hover, .go:focus-visible { background: rgba(102, 204, 255, .14); transform: translateY(-1px); }
  .go:active { transform: translateY(0); }

  .lang { margin-top: 18px; font-size: 12px; }
  .lang a { color: #66ccff; opacity: .75; text-decoration: none; }
  .lang a:hover { opacity: 1; }

  /* ---------- Android (Material You) ---------- */
  html[data-theme="android"] body { background: #fbfcfe; color: #1a1c1e; }
  html[data-theme="android"] .code {
    color: #00658f;
    font-weight: 500;
    letter-spacing: 2px;
    margin-bottom: 22px;
  }
  html[data-theme="android"] p { color: #41484d; font-size: 15px; }
  html[data-theme="android"] p b { color: #1a1c1e; font-weight: 500; }
  html[data-theme="android"] .poem {
    color: #00658f;
    font-family: Georgia, 'Noto Serif', serif;
    letter-spacing: .5px;
    padding: 16px 0;
    border-top: 1px solid #c1c7cc;
    border-bottom: 1px solid #c1c7cc;
  }
  html[data-theme="android"] .poem .author { color: #41484d; }
  html[data-theme="android"] .meta { color: #71787d; }
  html[data-theme="android"] .go {
    border: none;
    background: #00658f;
    color: #fff;
    font-weight: 500;
    letter-spacing: .2px;
    box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 1px 3px 1px rgba(0,0,0,.05);
  }
  html[data-theme="android"] .go:hover,
  html[data-theme="android"] .go:focus-visible {
    background: #004e70;
    transform: none;
    box-shadow: 0 1px 2px rgba(0,0,0,.1), 0 2px 6px 2px rgba(0,0,0,.06);
  }
  html[data-theme="android"] .lang a { color: #00658f; }

  /* ---------- Dark (original neon green) ---------- */
  html[data-theme="dark"] body {
    background: #050807;
    background-image:
      radial-gradient(circle at 15% 10%, rgba(0, 255, 140, 0.07) 0%, transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(0, 255, 140, 0.05) 0%, transparent 45%);
    color: #e8f5ee;
  }
  html[data-theme="dark"] .code {
    color: #00ff8c;
    background: linear-gradient(90deg, #ffffff, #00ff8c);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  html[data-theme="dark"] p { color: #b9d2c5; }
  html[data-theme="dark"] p b { color: #00ff8c; }
  html[data-theme="dark"] .poem { color: #00ff8c; }
  html[data-theme="dark"] .poem .author { color: #7fa893; }
  html[data-theme="dark"] .meta { color: #3d5a4b; }
  html[data-theme="dark"] .go { border-color: #00ff8c; color: #00ff8c; background: transparent; }
  html[data-theme="dark"] .go:hover,
  html[data-theme="dark"] .go:focus-visible { background: rgba(0, 255, 140, .12); }
  html[data-theme="dark"] .lang a { color: #7fa893; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">503</div>
    <p>Migrating and backing up account data. Preparing to restart.</p>
    <div class="poem">
      If you have a friend who knows your heart, distance cannot keep you apart.
      <span class="author">— Wang Bo, "Farewell to Prefect Du"</span>
    </div>
    <div class="meta">zrfeng.top · 503 SERVICE UNAVAILABLE</div>
    <a class="go" href="/en_us/notice/">Go to Notice Page</a>
    <p class="lang"><a href="/zh_cn/down/">中文</a></p>
  </div>
</body>
</html>
