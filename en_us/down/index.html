<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>503 · Service Unavailable</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    background: #050807;
    color: #e8f5ee;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }

  .box { max-width: 520px; width: 100%; text-align: center; }

  .code {
    font-size: clamp(72px, 18vw, 120px);
    font-weight: 900;
    letter-spacing: 6px;
    line-height: 1;
    margin-bottom: 18px;
    background: linear-gradient(90deg, #ffffff, #ffb020);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
  }

  p {
    font-size: 14.5px; line-height: 2; color: #b9d2c5; margin-bottom: 10px;
    word-break: break-all;
  }
  p b { color: #ffb020; }

  .meta {
    margin-top: 26px; font-size: 11px; color: #3d5a4b;
    letter-spacing: 1px; font-family: ui-monospace, Menlo, Consolas, monospace;
  }

  html[data-theme="light"] body { background: #f2f7f3; color: #10231a; }
  html[data-theme="light"] p { color: #3a5a4a; }
  html[data-theme="light"] .meta { color: #9aaa98; }
</style>
</head>
<body>
  <div class="box">
    <div class="code">503</div>
    <p>Due to a framework failure, this site <b>stopped serving on Nov 7, 2026, 20:30 (CST)</b>. <b>No ETA for recovery.</b></p>
    <div class="meta">zrfeng.top · 503 SERVICE UNAVAILABLE</div>
  </div>
<p style="text-align:center;font-size:12px;margin:16px 0 0"><a href="/zh_cn/down/?lang=zh" style="color:#3d5a4b;text-decoration:none">中文</a></p>
</body>
</html>
