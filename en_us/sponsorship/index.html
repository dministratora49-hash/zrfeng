<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script>/* 主题固定为「原生安卓」；旧的亮色 / 暗色已下线，老值一律当成 android，避免闪色 */(function(){document.documentElement.setAttribute('data-theme','android');})();</script>
<title>Sponsorship</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 20% 80%, rgba(0, 255, 140, 0.06), transparent 50%),
      radial-gradient(ellipse at 80% 20%, rgba(0, 255, 140, 0.04), transparent 50%),
      #050a07;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: 15vh;
    font-family: "Microsoft YaHei", sans-serif;
    position: relative;
    overflow-x: hidden;
  }

  /* 网格背景 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0, 255, 140, 0.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 255, 140, 0.035) 1px, transparent 1px);
    background-size: 44px 44px;
    pointer-events: none;
  }

  h1 {
    color: #00ff88;
    font-size: 26px;
    text-shadow: 0 0 18px rgba(0, 255, 136, 0.7), 0 0 40px rgba(0, 255, 136, 0.35);
    margin-bottom: 14px;
    letter-spacing: 2px;
  }

  .sub {
    color: rgba(200, 255, 220, 0.55);
    font-size: 13px;
    margin-bottom: 40px;
  }

  .cards {
    display: flex;
    gap: 18px;
  }

  .card {
    width: 140px;
    padding: 22px 14px;
    text-align: center;
    background: rgba(0, 20, 10, 0.55);
    border: 1px solid rgba(0, 255, 140, 0.35);
    border-radius: 12px;
    box-shadow: 0 0 18px rgba(0, 255, 136, 0.12), inset 0 0 12px rgba(0, 255, 136, 0.05);
    cursor: pointer;
    text-decoration: none;
    display: block;
    transition: box-shadow 0.25s, border-color 0.25s, transform 0.25s;
  }

  .card:hover {
    border-color: rgba(0, 255, 140, 0.8);
    box-shadow: 0 0 26px rgba(0, 255, 136, 0.3), inset 0 0 12px rgba(0, 255, 136, 0.08);
    transform: translateY(-2px);
  }

  .card .name {
    color: #d7ffe9;
    font-size: 15px;
    margin-bottom: 10px;
  }

  .card .cn {
    color: rgba(200, 255, 220, 0.6);
    font-size: 12px;
    margin-bottom: 12px;
  }

  .status {
    font-size: 11px;
    color: #ff5555;
    text-shadow: 0 0 10px rgba(255, 60, 60, 0.6);
  }

  .status::before {
    content: "●";
    margin-right: 5px;
    animation: blink 1.4s infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.25; }
  }

  /* GitHub 卡片 */
  .github-card {
    margin-top: 46px;
    width: 200px;
    padding: 20px 14px;
    text-align: center;
    background: rgba(0, 20, 10, 0.55);
    border: 1px solid rgba(0, 255, 140, 0.35);
    border-radius: 12px;
    box-shadow: 0 0 18px rgba(0, 255, 136, 0.12), inset 0 0 12px rgba(0, 255, 136, 0.05);
    cursor: pointer;
    text-decoration: none;
    display: block;
    transition: box-shadow 0.25s, border-color 0.25s, transform 0.25s;
  }

  .github-card:hover {
    border-color: rgba(0, 255, 140, 0.8);
    box-shadow: 0 0 26px rgba(0, 255, 136, 0.3), inset 0 0 12px rgba(0, 255, 136, 0.08);
    transform: translateY(-2px);
  }

  .github-card .star {
    font-size: 22px;
    margin-bottom: 8px;
    filter: drop-shadow(0 0 10px rgba(0, 255, 136, 0.6));
  }

  .github-card .text {
    color: #d7ffe9;
    font-size: 14px;
    margin-bottom: 8px;
  }

  .github-card .name {
    color: rgba(200, 255, 220, 0.6);
    font-size: 13px;
    margin-bottom: 10px;
  }

  /* 绿色在线状态 */
  .online {
    font-size: 11px;
    color: #00ff88;
    text-shadow: 0 0 10px rgba(0, 255, 136, 0.6);
  }

  .online::before {
    content: "●";
    margin-right: 5px;
    animation: blink 1.4s infinite;
  }

  /* Checking: grey and steady, so it cannot be mistaken for a real Online */
  .online.checking {
    color: rgba(160, 190, 175, 0.65);
    text-shadow: none;
    animation: none;
  }
  .online.checking::before { animation: none; opacity: .5; }

  /* Offline: red and steady — a blinking red is noisy for a stable state */
  .online.off {
    color: #ff5c5c;
    text-shadow: 0 0 10px rgba(255, 92, 92, 0.5);
  }
  .online.off::before { animation: none; }

  .github-card.off { border-color: rgba(255, 92, 92, 0.35); }

  /* 返回按钮 */
  .back-btn {
    margin-top: 46px;
    padding: 10px 36px;
    font-size: 14px;
    color: #00ff88;
    background: rgba(0, 255, 140, 0.06);
    border: 1px solid rgba(0, 255, 140, 0.5);
    border-radius: 8px;
    text-decoration: none;
    text-shadow: 0 0 8px rgba(0, 255, 136, 0.5);
    box-shadow: 0 0 14px rgba(0, 255, 136, 0.12);
    transition: box-shadow 0.25s, border-color 0.25s, background 0.25s;
  }

  .back-btn:hover {
    background: rgba(0, 255, 140, 0.14);
    border-color: rgba(0, 255, 140, 0.9);
    box-shadow: 0 0 22px rgba(0, 255, 136, 0.35);
  }
</style>
<link rel="stylesheet" href="/android.css">
</head>
<body>

  <h1>Sponsorship</h1>
  <div class="sub">Thank you for your support!</div>

  <!-- The WeChat Pay / Alipay cards were taken down; the payment pages themselves
       still exist, so restoring them only means adding the cards back. -->
  <a class="github-card" id="githubCard" href="https://github.com/dministratora49-hash/zrfeng/tree/main" target="_blank" rel="noopener">
    <div class="star">⭐</div>
    <div class="text">Star my repository</div>
    <div class="name">GitHub</div>
    <!-- Starts as "Checking": the probe decides Online / Offline, so we never
         show a fake Online first. -->
    <div class="online checking" id="githubState">Checking</div>
  </a>

  <a class="back-btn" href="/en_us/guide/">Back</a>

  <script>
  /* GitHub reachability: the Worker probes once (browsers cannot cross-origin
     probe github.com), this only paints the result. */
  (function () {
    var stateEl = document.getElementById('githubState');
    var cardEl = document.getElementById('githubCard');
    if (!stateEl) return;

    function show(online) {
      stateEl.className = 'online' + (online ? '' : ' off');
      stateEl.textContent = online ? 'Online' : 'Offline';
      if (cardEl) cardEl.className = 'github-card' + (online ? '' : ' off');
    }

    fetch('/api/github/status', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        // No answer counts as offline: this card exists to be clicked through to
        // GitHub, and a dead "Online" is worse than an honest "Offline".
        show(!!(j && j.ok && j.online));
      })
      .catch(function () { show(false); });
  })();
  </script>

  <script src="/en_us/status.js" defer></script>
</body>
</html>
