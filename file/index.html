<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>资源库 · zrfeng.top</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #050807;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0, 255, 140, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0, 255, 140, 0.05) 0%, transparent 50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 80px 24px 24px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e8f5ee;
  }

  /* 网格背景 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,140,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,140,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .top {
    position: relative;
    text-align: center;
    width: 100%;
    max-width: 820px;
  }

  h1 {
    font-size: 36px;
    margin-bottom: 20px;
    background: linear-gradient(90deg, #ffffff, #00ff8c);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.sub {
    color: #7fa893;
    font-size: 14px;
    letter-spacing: 1px;
    margin-bottom: 40px;
  }

  /* ===== 空状态 ===== */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    padding: 56px 28px;
    border: 1px dashed rgba(0, 255, 140, 0.3);
    border-radius: 20px;
    background: rgba(10, 18, 14, 0.7);
    box-shadow: 0 0 16px rgba(0, 255, 140, 0.08);
  }

  .empty .icon {
    font-size: 44px;
    line-height: 1;
    filter: drop-shadow(0 0 14px rgba(0, 255, 140, 0.35));
    opacity: 0.85;
  }

  .empty .title {
    font-size: 19px;
    letter-spacing: 2px;
    color: #e8f5ee;
  }

  .empty .desc {
    font-size: 13px;
    line-height: 1.9;
    color: #7fa893;
    letter-spacing: 1px;
  }

  .empty .tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 6px;
    padding: 5px 14px;
    font-size: 12px;
    letter-spacing: 1px;
    color: #ffb74d;
    border: 1px solid rgba(255, 183, 77, 0.35);
    border-radius: 20px;
    background: rgba(255, 183, 77, 0.08);
  }
  .empty .tag::before {
    content: "";
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #ffb74d;
    box-shadow: 0 0 8px #ffb74d;
    animation: blink 1.5s infinite;
  }

  @keyframes blink { 50% { opacity: 0.3; } }

  /* ===== 资源卡片（将来放资源时使用） ===== */
  .boxes {
    display: flex;
    gap: 24px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .box {
    display: inline-flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    width: 140px;
    height: 140px;
    border: 1px solid rgba(0, 255, 140, 0.35);
    border-radius: 16px;
    background: rgba(10, 18, 14, 0.85);
    text-decoration: none;
    color: #e8f5ee;
    box-shadow: 0 0 16px rgba(0, 255, 140, 0.1);
    transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
  }
  .box:hover {
    transform: translateY(-3px);
    border-color: #00ff8c;
    box-shadow: 0 0 28px rgba(0, 255, 140, 0.4);
  }
  .box .label { font-size: 16px; letter-spacing: 1px; }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: #00ff8c;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #00ff8c;
    box-shadow: 0 0 8px #00ff8c;
    animation: blink 1.5s infinite;
  }

  /* ===== 返回按钮 ===== */
  .back {
    position: relative;
    margin-top: 44px;
  }
  .back a {
    display: inline-block;
    padding: 11px 36px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #00ff8c;
    text-decoration: none;
    border: 1px solid rgba(0, 255, 140, 0.4);
    border-radius: 8px;
    background: rgba(0, 255, 140, 0.06);
    transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .back a:hover {
    background: rgba(0, 255, 140, 0.14);
    border-color: #00ff8c;
    box-shadow: 0 0 22px rgba(0, 255, 140, 0.3);
  }

  .bottom {
    position: relative;
    text-align: center;
    font-size: 12px;
    color: #4a6a58;
    line-height: 2;
    letter-spacing: 1px;
    margin-top: 48px;
  }

  @media (max-width: 520px) {
    body { padding-top: 56px; }
    h1 { font-size: 28px; }
    .empty { padding: 44px 20px; }
  }
</style>
</head>
<body>
  <div class="top">
    <h1>资源库</h1>
    <p class="sub">精选工具与链接，持续整理中</p>

    <!-- 目前为空状态；将来添加资源时，把下面的 .empty 换成 .boxes 结构即可 -->
    <div class="empty">
      <div class="icon">📦</div>
      <div class="title">暂无资源</div>
      <div class="desc">
        这里还没有发布任何资源<br>
        整理完成后会陆续上线
      </div>
      <span class="tag">建设中</span>
    </div>

    <div class="back">
      <a href="https://www.zrfeng.top/guide">← 返回导航站</a>
    </div>

    <!--
      添加资源时参考这段结构（复制多个即可）：

      <div class="boxes">
        <a class="box" href="https://example.com">
          <span class="label">资源名称</span>
          <span class="status"><span class="dot"></span>可用</span>
        </a>
      </div>
    -->
  </div>

  <div>
    <div class="bottom">
      <div>zrfeng.top</div>
      <div>© 2026 zrfeng.top — All Rights Reserved</div>
    </div>
  </div>
</body>
</html>
