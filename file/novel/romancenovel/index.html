<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>言情小说 · zrfeng.top</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #050807;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0, 255, 140, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0, 255, 140, 0.05) 0%, transparent 50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 80px 24px 24px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e8f5ee;
  }

  /* 网格背景 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,140,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,140,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .top {
    position: relative;
    text-align: center;
    width: 100%;
    max-width: 820px;
  }

  h1 {
    font-size: 30px;
    margin-bottom: 44px;
    background: linear-gradient(90deg, #ffffff, #00ff8c);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  /* ===== 作品横排：书名靠左，状态与下载靠右 ===== */
  .row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    padding: 24px 28px;
    border: 1px solid rgba(0, 255, 140, 0.35);
    border-radius: 16px;
    background: rgba(10, 18, 14, 0.85);
    box-shadow: 0 0 16px rgba(0, 255, 140, 0.1);
  }

  .book {
    font-size: 19px;
    letter-spacing: 2px;
    color: #e8f5ee;
  }

  /* 右侧一组：状态 + 下载 */
  .row .right {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-left: auto;
  }

  .status {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    color: #00ff8c;
    white-space: nowrap;
  }
  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #00ff8c;
    box-shadow: 0 0 8px #00ff8c;
    animation: blink 1.5s infinite;
  }
  @keyframes blink { 50% { opacity: 0.3; } }

  .dl-btn {
    display: inline-block;
    padding: 9px 30px;
    font-size: 14px;
    font-family: inherit;
    letter-spacing: 2px;
    color: #00ff8c;
    border: 1px solid rgba(0, 255, 140, 0.5);
    border-radius: 8px;
    background: rgba(0, 255, 140, 0.08);
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .dl-btn:hover {
    background: rgba(0, 255, 140, 0.16);
    border-color: #00ff8c;
    box-shadow: 0 0 20px rgba(0, 255, 140, 0.3);
  }

  /* ===== 返回按钮 ===== */
  .back {
    position: relative;
    margin-top: 34px;
  }
  .back a {
    display: inline-block;
    padding: 11px 36px;
    font-size: 14px;
    letter-spacing: 2px;
    color: #00ff8c;
    text-decoration: none;
    border: 1px solid rgba(0, 255, 140, 0.4);
    border-radius: 8px;
    background: rgba(0, 255, 140, 0.06);
    transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .back a:hover {
    background: rgba(0, 255, 140, 0.14);
    border-color: #00ff8c;
    box-shadow: 0 0 22px rgba(0, 255, 140, 0.3);
  }

  /* ===== 弹窗 ===== */
  .mask {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background: rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(3px);
  }
  .mask.on { display: flex; }

  .modal {
    width: 100%;
    max-width: 320px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    padding: 30px 26px 24px;
    text-align: center;
    border: 1px solid rgba(0, 255, 140, 0.35);
    border-radius: 16px;
    background: #0a120e;
    box-shadow: 0 0 40px rgba(0, 255, 140, 0.18);
    animation: pop 0.22s ease;
  }
  @keyframes pop {
    from { opacity: 0; transform: translateY(12px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .modal .head {
    font-size: 13px;
    letter-spacing: 2px;
    color: #7fa893;
    margin-bottom: 20px;
  }

  .client {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px;
    font-size: 16px;
    letter-spacing: 1px;
    color: #00ff8c;
    text-decoration: none;
    border: 1px solid rgba(0, 255, 140, 0.4);
    border-radius: 12px;
    background: rgba(0, 255, 140, 0.06);
    transition: background 0.25s, border-color 0.25s, box-shadow 0.25s;
  }
  .client + .client { margin-top: 12px; }
  .client:hover {
    background: rgba(0, 255, 140, 0.14);
    border-color: #00ff8c;
    box-shadow: 0 0 22px rgba(0, 255, 140, 0.3);
  }

  .close {
    display: inline-block;
    margin-top: 18px;
    padding: 8px 26px;
    font-size: 13px;
    font-family: inherit;
    letter-spacing: 1px;
    color: #7fa893;
    border: 1px solid rgba(0, 255, 140, 0.2);
    border-radius: 8px;
    background: transparent;
    cursor: pointer;
    transition: color 0.25s, border-color 0.25s;
  }
  .close:hover { color: #e8f5ee; border-color: rgba(0, 255, 140, 0.5); }

  /* ===== 底部 ===== */
  .bottom {
    position: relative;
    text-align: center;
    font-size: 12px;
    color: #4a6a58;
    line-height: 2;
    letter-spacing: 1px;
    margin-top: 48px;
  }

  @media (max-width: 520px) {
    body { padding-top: 56px; }
    h1 { font-size: 23px; margin-bottom: 34px; }
    .row { gap: 12px; padding: 20px 18px; }
    .book { font-size: 17px; }
    .row .right { gap: 14px; }
    .dl-btn { padding: 8px 22px; letter-spacing: 1px; }
    .back a { padding: 10px 28px; }
  }
</style>
</head>
<body>
  <div class="top">
    <h1>这里是言情小说部分</h1>

    <div class="row">
      <span class="book">《听潮》</span>
      <span class="right">
        <span class="status"><span class="dot"></span>开放下载</span>
        <button class="dl-btn" id="dlBtn" type="button">下载</button>
      </span>
    </div>

    <div class="back">
      <a href="https://www.zrfeng.top/file/novel">← 返回小说页</a>
    </div>
  </div>

  <div class="bottom">
    <div>zrfeng.top</div>
    <div>© 2026 zrfeng.top — All Rights Reserved</div>
  </div>

  <!-- 下载弹窗 -->
  <div class="mask" id="mask">
    <div class="modal">
      <div class="head">选择下载方式</div>
      <a class="client" href="https://share.feijipan.com/s/zVwvQGQA" target="_blank" rel="noopener">☁ 小飞机网盘</a>
      <a class="client" href="https://1849827934.share.123pan.cn/123pan/YlKovd-Ins0d" target="_blank" rel="noopener">☁ 123网盘</a>
      <a class="client" href="https://pan.xunlei.com/s/VP3cwjtUAt_ZQPZXiSlbA30OA1?pwd=2hae" target="_blank" rel="noopener">☁ 迅雷云盘</a>
      <button class="close" id="closeBtn" type="button">关闭</button>
    </div>
  </div>

<script>
(function () {
  var mask = document.getElementById('mask');
  var dlBtn = document.getElementById('dlBtn');
  var closeBtn = document.getElementById('closeBtn');

  function open() { mask.classList.add('on'); }
  function close() { mask.classList.remove('on'); }

  dlBtn.addEventListener('click', open);
  closeBtn.addEventListener('click', close);

  /* 点击遮罩空白处关闭 */
  mask.addEventListener('click', function (e) {
    if (e.target === mask) close();
  });

  /* 按 Esc 关闭 */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') close();
  });
})();
</script>
</body>
</html>
