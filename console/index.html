<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>控制台 · zrfeng</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    padding: 56px 16px 40px;
    background: #050807;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e8f5ee;
    font-size: 14px;
  }
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,140,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,140,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }
  .wrap { position: relative; max-width: 760px; margin: 0 auto; }
  h1 { font-size: 24px; color: #00ff8c; letter-spacing: 1px; margin-bottom: 6px; }
  .sub { font-size: 12px; color: #7fa893; margin-bottom: 22px; }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(84px, 1fr)); gap: 10px; margin-bottom: 22px; }
  .stat {
    padding: 14px 10px; text-align: center;
    border: 1px solid rgba(0,255,140,0.22); border-radius: 12px; background: rgba(10,18,14,0.7);
  }
  .stat b { display: block; font-size: 22px; color: #00ff8c; font-family: Orbitron, monospace; }
  .stat span { font-size: 11px; color: #7fa893; }

  .card {
    border: 1px solid rgba(0,255,140,0.35); border-radius: 16px;
    background: rgba(10,18,14,0.9); padding: 20px 18px; margin-bottom: 18px;
  }
  .card h2 { font-size: 15px; color: #00ff8c; margin-bottom: 14px; font-weight: 600; }

  .row {
    display: flex; align-items: center; gap: 10px;
    padding: 11px 0; border-bottom: 1px solid rgba(0,255,140,0.1); flex-wrap: wrap;
  }
  .row:last-child { border-bottom: none; }
  .info { flex: 1; min-width: 140px; }
  .name { font-size: 14px; color: #e8f5ee; word-break: break-all; }
  .meta { font-size: 11px; color: #7fa893; margin-top: 3px; word-break: break-all; }

  .tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 11px; margin-left: 6px; vertical-align: middle; }
  .tag.active  { background: rgba(0,255,140,0.15); color: #00ff8c; border: 1px solid rgba(0,255,140,0.4); }
  .tag.trial   { background: rgba(255,204,0,0.15); color: #ffcc00; border: 1px solid rgba(255,204,0,0.4); }
  .tag.blocked { background: rgba(255,77,77,0.15); color: #ff5c5c; border: 1px solid rgba(255,77,77,0.45); }
  .tag.admin   { background: rgba(0,200,255,0.15); color: #4dd2ff; border: 1px solid rgba(0,200,255,0.4); }
  .tag.banned  { background: rgba(255,68,68,0.18); color: #ff4444; border: 1px solid rgba(255,68,68,0.55); }
  .tag.super   { background: rgba(255,215,0,0.18); color: #ffd700; border: 1px solid rgba(255,215,0,0.5); }
  .tag.sub     { background: rgba(170,120,255,0.18); color: #b98cff; border: 1px solid rgba(170,120,255,0.5); }

  button {
    padding: 7px 13px; border-radius: 8px;
    border: 1px solid rgba(0,255,140,0.45); background: rgba(0,255,140,0.08);
    color: #00ff8c; font-size: 12px; cursor: pointer; font-family: inherit; white-space: nowrap;
  }
  button:active { opacity: .65; }
  button:disabled { opacity: .35; cursor: default; }
  button.warn { border-color: rgba(255,77,77,0.5); background: rgba(255,77,77,0.1); color: #ff8a8a; }
  button.mute { border-color: rgba(127,168,147,0.4); background: transparent; color: #7fa893; }

  /* 通知条：左边文字，右边「已读」 */
  .notice {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    border: 1px solid rgba(255,204,0,0.5); border-radius: 14px;
    background: rgba(255,204,0,0.07); padding: 14px 16px; margin-bottom: 18px;
  }
  .notice .nt-l { flex: 1; min-width: 0; }
  .notice .nt-t { font-size: 14px; color: #ffcc00; font-weight: 600; }
  .notice .nt-s { font-size: 11px; color: #a9a07a; margin-top: 4px; }
  .notice button { border-color: rgba(255,204,0,0.55); background: rgba(255,204,0,0.12); color: #ffcc00; }

  .dellist { border-top: 1px solid rgba(255,204,0,0.18); padding-top: 10px; margin-bottom: 18px; }
  .delrow { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; color: #b9b09a; padding: 5px 0; }
  .delrow .d-u { color: #e8d9a0; word-break: break-all; }
  .delrow .d-t { color: #7fa893; white-space: nowrap; font-size: 11px; }

  .msg { font-size: 12px; margin-top: 12px; min-height: 16px; }
  .msg.ok { color: #00ff8c; }
  .msg.err { color: #ff5c5c; }
  .center { text-align: center; color: #7fa893; padding: 30px 0; line-height: 1.9; }
  .center a { color: #00ff8c; }

  .kv { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 13px; }
  .kv div { color: #7fa893; }
  .kv b { color: #e8f5ee; font-weight: 500; }

  /* 维护时间面板 */
  .maint {
    border: 1px solid rgba(255,170,0,0.4); border-radius: 16px;
    background: rgba(18,14,6,0.9); padding: 20px 18px; margin-bottom: 18px;
  }
  .maint h2 { font-size: 15px; color: #ffb020; margin-bottom: 6px; font-weight: 600; }
  .maint .m-stat { font-size: 12px; color: #b9a888; margin-bottom: 14px; line-height: 1.8; }
  .maint .m-stat b { color: #ffb020; }
  .m-field { margin-bottom: 12px; }
  .m-field label { display: block; font-size: 12px; color: #a89b7c; margin-bottom: 5px; }
  .m-field input {
    width: 100%; padding: 10px 12px; border-radius: 9px;
    border: 1px solid rgba(255,170,0,0.35); background: rgba(0,0,0,0.45);
    color: #f0e8d8; font-size: 14px; font-family: inherit;
  }
  .m-field input:focus { outline: none; border-color: rgba(255,170,0,0.8); }
  .m-acts { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 6px; }
  .m-acts button { flex: 1; min-width: 110px; border-color: rgba(255,170,0,0.5); background: rgba(255,170,0,0.1); color: #ffc55c; }
  .m-quick { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
  .m-quick button { font-size: 11px; padding: 5px 10px; border-color: rgba(255,170,0,0.3); background: transparent; color: #c9b48a; }
  .m-now { font-size: 11px; color: #8a8060; margin-top: 10px; }

  /* 弹窗 */
  .mask {
    position: fixed; inset: 0; z-index: 100000; background: rgba(0,0,0,.78);
    display: flex; align-items: center; justify-content: center; padding: 18px;
  }
  .mask.hidden { display: none; }
  .modal {
    width: 100%; max-width: 380px; padding: 24px 20px;
    background: rgba(16,10,10,.99); border: 1px solid rgba(255,77,77,.5);
    border-radius: 16px; box-shadow: 0 0 40px rgba(255,77,77,.16);
  }
  .modal h3 { font-size: 17px; color: #ff5c5c; margin-bottom: 8px; }
  .modal p { font-size: 13px; line-height: 1.85; color: #d8c8c8; margin-bottom: 14px; }
  .modal p.small { font-size: 12px; color: #a08f8f; }
  .modal input {
    width: 100%; padding: 11px 13px; margin-bottom: 12px;
    border: 1px solid rgba(255,77,77,.4); border-radius: 9px;
    background: rgba(0,0,0,.45); color: #f0e8e8; font-size: 15px; font-family: inherit;
  }
  .modal input:focus { outline: none; border-color: rgba(255,77,77,.85); }
  .modal input.code { letter-spacing: 7px; text-align: center; font-family: ui-monospace, monospace; font-size: 20px; }
  .modal .acts { display: flex; gap: 10px; }
  .modal .acts button { flex: 1; padding: 10px 0; font-size: 13px; }
  .modal .err { color: #ff7b7b; font-size: 12px; min-height: 17px; margin-bottom: 6px; }
  .step-hint { font-size: 11px; color: #a08f8f; margin-bottom: 12px; }
  .modal .m-field { margin-bottom: 10px; }
  .modal .m-field label { color: #a08f8f; }
  .modal .m-field input {
    width: 100%; padding: 10px 12px; border-radius: 9px; font-size: 14px; font-family: inherit;
    border: 1px solid rgba(255,77,77,.4); background: rgba(0,0,0,.45); color: #f0e8e8;
  }
  .modal .m-field input:focus { outline: none; border-color: rgba(255,77,77,.85); }
  .modal .m-quick { display: flex; gap: 8px; flex-wrap: wrap; margin: 4px 0 0; }
  .modal .m-quick button {
    flex: 1; min-width: 62px; font-size: 11px; padding: 6px 8px;
    border-color: rgba(255,77,77,.35); background: transparent; color: #e0a0a0;
  }

  @media (max-width: 520px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    h1 { font-size: 20px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>控制台</h1>
  <div class="sub" id="who">加载中…</div>
  <div id="notices"></div>
  <div id="maint"></div>
  <div id="me"></div>
  <div id="app"></div>
</div>

<!-- 注销弹窗：密码 → 邮件确认码 → 二次确认 -->
<div class="mask hidden" id="delMask">
  <div class="modal">
    <h3 id="dmTitle">注销账户</h3>
    <div class="step-hint" id="dmStep">第 1 / 2 步</div>
    <div id="dmBody"></div>
    <div class="err" id="dmErr"></div>
    <div class="acts" id="dmActs"></div>
  </div>
</div>

<script>
(function () {
  var who = document.getElementById('who');
  var noticesEl = document.getElementById('notices');
  var maintEl = document.getElementById('maint');
  var meEl = document.getElementById('me');
  var app = document.getElementById('app');

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }
  function p2(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtDate(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate());
  }
  function fmtTime(ts) {
    if (!ts) return '—';
    var d = new Date(ts);
    return p2(d.getMonth() + 1) + '-' + p2(d.getDate()) + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  function fmtClock(ts) { return fmtTime(ts); }
  /** 时间戳 → <input type="datetime-local"> 需要的本地格式 */
  function toLocalInput(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) +
      'T' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  function fromLocalInput(v) { return v ? new Date(v).getTime() : NaN; }

  function tagOf(u) {
    if (u.role === 'super') return '<span class="tag super">主管理员</span>';
    if (u.role === 'sub') return '<span class="tag sub">副管理员</span>';
    if (u.banned) return '<span class="tag banned">已封禁</span>';
    if (u.state === 'active') return '<span class="tag active">已激活</span>';
    if (u.state === 'blocked') return '<span class="tag blocked">试用期已到</span>';
    return '<span class="tag trial">未激活 ' + (u.days != null ? u.days + ' 天' : '') + '</span>';
  }

  /* ===================== 我的账户 ===================== */
  var ME = null;

  function renderMe(j) {
    var u = j.user || {};
    var acc = j.account || {};
    var dotColor = acc.dot === 'green' ? '#00ff8c' : (acc.dot === 'yellow' ? '#ffcc00' : '#ff4d4d');
    var html =
      '<div class="card"><h2>我的账户</h2>' +
      '<div class="kv">' +
      '<div>用户名：<b>' + esc(u.username) + '</b></div>' +
      '<div>邮箱：<b>' + esc(u.email || '（未绑定）') + '</b></div>' +
      '<div>状态：<b style="color:' + dotColor + '">' + esc(acc.label || '—') + '</b></div>' +
      '</div>' +
      '<div class="msg" id="meMsg"></div>';

    if (u.canDelete) {
      html +=
        '<div class="row" style="margin-top:14px;border-top:1px solid rgba(0,255,140,0.1);border-bottom:none">' +
        '<div class="info"><div class="name">注销账户</div>' +
        '<div class="meta">需要邮件确认码；注销后该邮箱不可再次注册，数据无法恢复</div></div>' +
        '<button class="warn" id="delBtn">注销账户</button>' +
        '</div>';
    } else if (u.isAdmin) {
      html += '<div class="msg" style="color:#7fa893">管理员账户不可注销。</div>';
    } else if (u.isTrial) {
      html += '<div class="msg" style="color:#7fa893">试用账户不可注销。</div>';
    }
    html += '</div>';

    // 账户安全：改用户名 / 改密码，两者都必须过邮箱验证码
    var sec = '';
    if (u.canChangeUsername) {
      sec += '<div class="row"><div class="info">' +
        '<div class="name">修改用户名</div>' +
        '<div class="meta">需要邮箱验证码；改后本设备保持登录，其它设备需重新登录</div></div>' +
        '<button data-ch="username">修改</button></div>';
    }
    if (u.canChangePassword) {
      sec += '<div class="row"><div class="info">' +
        '<div class="name">修改密码</div>' +
        '<div class="meta">需要邮箱验证码；改后其它设备会被登出</div></div>' +
        '<button data-ch="password">修改</button></div>';
    }
    if (u.canAddEmail) {
      sec += '<div class="row"><div class="info">' +
        '<div class="name">添加邮箱</div>' +
        '<div class="meta">账户还没有邮箱。绑定邮箱并验证后，账户即完成激活（只需验证新邮箱 + 密码）</div></div>' +
        '<button data-em="add">添加并激活</button></div>';
    }
    if (u.canChangeEmail) {
      sec += '<div class="row"><div class="info">' +
        '<div class="name">更改邮箱</div>' +
        '<div class="meta">当前：' + esc(u.email || '') + '。需要先验证当前邮箱，再验证新邮箱</div></div>' +
        '<button data-em="change">更改</button></div>';
    }
    if (sec) html += '<div class="card"><h2>账户安全</h2>' + sec + '</div>';
    meEl.innerHTML = html;

    var b = document.getElementById('delBtn');
    if (b) b.onclick = openDelete;
    meEl.querySelectorAll('button[data-ch]').forEach(function (x) {
      x.onclick = function () { openChange(x.dataset.ch); };
    });
    meEl.querySelectorAll('button[data-em]').forEach(function (x) {
      x.onclick = function () { openEmail(x.dataset.em); };
    });
  }

  /* ===================== 修改用户名 / 修改密码 ===================== */
  var changeField = null;

  function openChange(field) {
    changeField = field;
    var isName = field === 'username';
    setErr('');
    dmTitle.textContent = isName ? '修改用户名' : '修改密码';
    dmStep.textContent = '第 1 / 2 步 · ' + (isName ? '输入新用户名' : '输入新密码');
    dmBody.innerHTML = isName
      ? '<p>新用户名需要<b>邮箱验证</b>后才会生效。</p>' +
        '<p class="small">3-20 位，仅字母、数字、下划线、连字符。改后本设备保持登录，其它设备需重新登录。</p>' +
        '<input type="text" id="chVal" placeholder="新用户名" autocomplete="off">'
      : '<p>新密码需要<b>邮箱验证</b>后才会生效。</p>' +
        '<p class="small">至少 6 位。改后其它设备会被登出，本设备保持登录。</p>' +
        '<input type="password" id="chVal" placeholder="新密码" autocomplete="new-password">' +
        '<input type="password" id="chVal2" placeholder="再输一次新密码" autocomplete="new-password">';
    dmActs.innerHTML =
      '<button class="mute" id="chCancel">取消</button>' +
      '<button id="chSend">发送验证码</button>';
    delMask.className = 'mask';
    document.getElementById('chCancel').onclick = closeModal;
    document.getElementById('chSend').onclick = sendChange;
    var v = document.getElementById('chVal');
    if (v) v.focus();
  }

  function sendChange() {
    var isName = changeField === 'username';
    var v1 = (document.getElementById('chVal') || {}).value || '';
    if (!v1) { setErr(isName ? '请输入新用户名' : '请输入新密码'); return; }
    if (!isName) {
      var v2 = (document.getElementById('chVal2') || {}).value || '';
      if (v1 !== v2) { setErr('两次输入的密码不一致'); return; }
      if (v1.length < 6) { setErr('密码至少 6 位'); return; }
    }
    var btn = document.getElementById('chSend');
    btn.disabled = true;
    setErr('');
    fetch('/api/account/change/request', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ field: changeField, value: v1 }),
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { setErr(j.message || '发送失败'); btn.disabled = false; return; }
        openChangeStep2(j.message || '');
      })
      .catch(function () { setErr('网络错误'); btn.disabled = false; });
  }

  function openChangeStep2(sentMsg) {
    var isName = changeField === 'username';
    setErr('');
    dmTitle.textContent = isName ? '修改用户名' : '修改密码';
    dmStep.textContent = '第 2 / 2 步 · 输入邮件验证码';
    dmBody.innerHTML =
      '<p>' + esc(sentMsg) + '</p>' +
      '<p class="small">10 分钟内有效。如果没收到，请查看垃圾箱。</p>' +
      '<input type="text" class="code" id="chCode" inputmode="numeric" maxlength="6" placeholder="000000">';
    dmActs.innerHTML =
      '<button class="mute" id="chBack">返回</button>' +
      '<button id="chConfirm">确认修改</button>';
    document.getElementById('chBack').onclick = function () { openChange(changeField); };
    document.getElementById('chConfirm').onclick = doChange;
    var c = document.getElementById('chCode');
    if (c) { c.focus(); c.onkeydown = function (e) { if (e.key === 'Enter') doChange(); }; }
  }

  function doChange() {
    var code = ((document.getElementById('chCode') || {}).value || '').trim();
    if (!/^\d{6}$/.test(code)) { setErr('请输入 6 位验证码'); return; }
    var btn = document.getElementById('chConfirm');
    btn.disabled = true;
    setErr('');
    fetch('/api/account/change/confirm', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ field: changeField, code: code }),
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { setErr(j.message || '修改失败'); btn.disabled = false; return; }
        dmTitle.textContent = '修改成功';
        dmStep.textContent = '完成';
        dmBody.innerHTML = '<p>' + esc(j.message) + '</p>';
        dmActs.innerHTML = '<button id="chDone">好</button>';
        document.getElementById('chDone').onclick = function () { closeModal(); loadMe(); };
        setTimeout(function () { closeModal(); loadMe(); }, 1800);
      })
      .catch(function () { setErr('网络错误'); btn.disabled = false; });
  }

  /* ===================== 注销流程（两步） ===================== */
  var delMask = document.getElementById('delMask');
  var dmTitle = document.getElementById('dmTitle');
  var dmStep = document.getElementById('dmStep');
  var dmBody = document.getElementById('dmBody');
  var dmErr = document.getElementById('dmErr');
  var dmActs = document.getElementById('dmActs');
  var sentTo = '';

  function closeModal() { delMask.className = 'mask hidden'; }
  function setErr(t) { dmErr.textContent = t || ''; }

  function openDelete() {
    setErr('');
    dmTitle.textContent = '注销账户';
    dmStep.textContent = '第 1 / 2 步 · 验证密码';
    dmBody.innerHTML =
      '<p>注销是不可恢复的操作。确认后会向你的邮箱发送一个 <b>6 位确认码</b>，' +
      '需要再次输入才能完成注销。</p>' +
      '<p class="small">注销后该邮箱<b>不可再次注册</b>。</p>' +
      '<input type="password" id="dmPwd" placeholder="请输入当前密码" autocomplete="current-password">';
    dmActs.innerHTML =
      '<button class="mute" id="dmCancel">取消</button>' +
      '<button class="warn" id="dmSend">发送确认码</button>';
    delMask.className = 'mask';
    document.getElementById('dmCancel').onclick = closeModal;
    document.getElementById('dmSend').onclick = sendCode;
    var p = document.getElementById('dmPwd');
    if (p) { p.focus(); p.onkeydown = function (e) { if (e.key === 'Enter') sendCode(); }; }
  }

  function sendCode() {
    var p = document.getElementById('dmPwd');
    var pwd = p ? p.value : '';
    if (!pwd) { setErr('请输入密码'); return; }
    var btn = document.getElementById('dmSend');
    btn.disabled = true;
    setErr('');
    fetch('/api/account/delete/request', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ password: pwd }),
    })
      .then(function (r) { return r.json().then(function (j) { return { s: r.status, j: j }; }); })
      .then(function (res) {
        if (!res.j.ok) { setErr(res.j.message || '发送失败'); btn.disabled = false; return; }
        sentTo = res.j.message || '';
        step2();
      })
      .catch(function () { setErr('网络错误'); btn.disabled = false; });
  }

  function step2() {

  /* ===================== 管理员：账户管理 ===================== */
  /** 我是不是主管理员（只有主管理员能改别人的管理员权限） */
  function amSuper() { return !!(ME && ME.user && ME.user.isSuper); }

  /**
   * 某一行账户的操作按钮。权限规则与服务端一致：
   *   主管理员账户 —— 任何人都不能操作
   *   副管理员账户 —— 只有主管理员能操作（副管理员之间互相不能动）
   *   普通用户     —— 主/副管理员都能操作
   *   设/解除副管理员 —— 仅主管理员
   */
  function rowButtons(u, iAmSuper) {
    if (u.role === 'super') return '<button class="mute" disabled>不可操作</button>';

    var canManage = iAmSuper || u.role === 'user';
    if (!canManage) return '<button class="mute" disabled>副管理员</button>';

    var un = esc(u.username);
    var out = '';
    if (u.role === 'user') {
      if (u.state === 'active') out += '<button class="warn" data-act="deactivate" data-u="' + un + '">取消激活</button>';
      else out += '<button data-act="activate" data-u="' + un + '">激活</button>';
      out += '<button data-act="extend" data-u="' + un + '">续 7 天</button>';
    }
    out += u.banned
      ? '<button data-act="unban" data-u="' + un + '">解封</button>'
      : '<button class="warn" data-act="ban" data-u="' + un + '">封禁</button>';
    if (iAmSuper) {
      out += u.role === 'sub'
        ? '<button class="mute" data-act="demote" data-u="' + un + '">解除管理员</button>'
        : '<button data-act="promote" data-u="' + un + '">设为副管理员</button>';
    }
    return out;
  }

  var USERS = [];

  function renderUsers(data) {
    var s = data.stats || {};
    var iAmSuper = amSuper();
    USERS = data.users || [];
    var html =
      '<div class="stats">' +
      '<div class="stat"><b>' + (s.total || 0) + '</b><span>账户总数</span></div>' +
      '<div class="stat"><b>' + (s.active || 0) + '</b><span>已激活</span></div>' +
      '<div class="stat"><b>' + (s.trial || 0) + '</b><span>试用中</span></div>' +
      '<div class="stat"><b style="color:#ff5c5c">' + (s.blocked || 0) + '</b><span>已到期</span></div>' +

      '<div class="card"><h2>账户管理</h2>';

    if (!data.users.length) {
      html += '<div class="center">暂无账户</div>';

          meta += u.banUntil

        }

          '<div class="name">' + esc(u.username) + tagOf(u) + '</div>' +
          '<div class="meta">' + esc(meta) + '</div></div>' +
          rowButtons(u, iAmSuper);
        html += '</div>';
      });
    }
    html += '</div><div class="msg" id="msg"></div>';

    app.querySelectorAll('button[data-act]').forEach(function (b) { b.onclick = function () { act(b); }; });

  function note(text, ok) {
    var m = document.getElementById('msg');
    if (!m) return;
    m.textContent = text;
    m.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  function act(btn) {
    var action = btn.dataset.act;
    var username = btn.dataset.u;

    // 封禁需要先选起止时间，弹窗里再提交
    if (action === 'ban') {
      var target = USERS.filter(function (x) { return x.username === username; })[0];
      openBan(target || { username: username });
      return;
    }

    var url, body;
    if (action === 'extend') {
      url = '/api/admin/extend';
      body = { username: username, days: 7 };
    } else if (action === 'activate' || action === 'deactivate') {
      url = '/api/admin/activate';
      body = { username: username, activate: action === 'activate' };
    } else if (action === 'promote' || action === 'demote') {
      url = '/api/admin/role';
      body = { username: username, admin: action === 'promote' };
    } else {
      // ban / unban
      url = '/api/admin/ban';
      body = { username: username, banned: action === 'ban' };
    }
    btn.disabled = true;
    fetch(url, { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        note(j.message || (j.ok ? '完成' : '失败'), !!j.ok);
        if (j.ok) loadAdmin(); else btn.disabled = false;
      })
      .catch(function () { note('网络错误', false); btn.disabled = false; });
  }

  /* ===================== 添加邮箱 / 更改邮箱 ===================== */
  var emailAction = null;

  function openEmail(action) {
    emailAction = action;
    setErr('');
    if (action === 'add') return openEmailAdd();
    return openEmailChangeOld();
  }

  /** 添加邮箱（账户还没有邮箱）：验证新邮箱 + 密码 → 激活 */
  function openEmailAdd() {
    dmTitle.textContent = '添加邮箱并激活';

      '<input type="email" id="emMail" placeholder="要绑定的邮箱" autocomplete="email">' +
      '<input type="password" id="emPwd" placeholder="当前密码" autocomplete="current-password">';

      '<button class="mute" id="emCancel">取消</button>' +
      '<button id="emSend">发送验证码</button>';

  /** 更改邮箱 · 第 1 步：先验证当前（旧）邮箱 */
  function openEmailChangeOld() {
    dmTitle.textContent = '更改邮箱';
    dmStep.textContent = '第 1 / 2 步 · 验证当前邮箱';
    dmBody.innerHTML =
      '<p>为了安全，改邮箱要<b>先验证当前邮箱</b>，再验证新邮箱。</p>' +
      '<p class="small">点下面的按钮，我们会把验证码发到你现在绑定的邮箱。</p>';

      '<button class="mute" id="emCancel">取消</button>' +
      '<button id="emSendOld">发送验证码到当前邮箱</button>';

    document.getElementById('emCancel').onclick = closeModal;
    document.getElementById('emSendOld').onclick = function () {
      var b = document.getElementById('emSendOld');
      b.disabled = true;
      setErr('');
      emailPost({ action: 'change', step: 'old' }, function (j) {
        emailCodeStep('change', j.message || '', '旧邮箱验证码', '确认并继续');
      }, function () { b.disabled = false; });
    };

  function sendEmailCode() {
    var mail = (document.getElementById('emMail') || {}).value || '';
    var pwd = (document.getElementById('emPwd') || {}).value || '';
    if (!mail.trim()) { setErr('请输入邮箱'); return; }
    if (!pwd) { setErr('请输入密码'); return; }
    var b = document.getElementById('emSend');
    b.disabled = true;
    setErr('');
    emailPost(
      { action: emailAction, step: 'new', email: mail.trim(), password: pwd },
      function (j) { emailCodeStep(emailAction, j.message || '', emailAction === 'add' ? '新邮箱验证码' : '新邮箱验证码', emailAction === 'add' ? '确认并激活' : '确认更改'); },
      function () { b.disabled = false; }
    );
  }

  /** 通用的「输入验证码」步骤 */
  function emailCodeStep(action, sentMsg, label, okText) {
    setErr('');
    dmStep.textContent = '第 2 / 2 步 · ' + label;
    dmBody.innerHTML =
      '<p>' + esc(sentMsg) + '</p>' +
      '<p class="small">10 分钟内有效。如果没收到，请查看垃圾箱。</p>' +
      '<input type="text" class="code" id="emCode" inputmode="numeric" maxlength="6" placeholder="000000">';
    dmActs.innerHTML =
      '<button class="mute" id="emBack">返回</button>' +
      '<button id="emOk">' + esc(okText) + '</button>';
    document.getElementById('emBack').onclick = function () { openEmail(action); };
    document.getElementById('emOk').onclick = function () { confirmEmail(action, this); };
    var c = document.getElementById('emCode');
    if (c) { c.focus(); c.onkeydown = function (e) { if (e.key === 'Enter') confirmEmail(action, null); }; }
  }

  function emailPost(body, onOk, onErr) {
    fetch('/api/account/email/request', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { setErr(j.message || '发送失败'); if (onErr) onErr(); return; }
        onOk(j);
      })
      .catch(function () { setErr('网络错误'); if (onErr) onErr(); });
  }

  function confirmEmail(action, btn) {
    var code = ((document.getElementById('emCode') || {}).value || '').trim();
    if (!/^\d{6}$/.test(code)) { setErr('请输入 6 位验证码'); return; }
    if (btn) btn.disabled = true;
    setErr('');
    fetch('/api/account/email/confirm', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ action: action, code: code }),
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { setErr(j.message || '验证失败'); if (btn) btn.disabled = false; return; }

        // 旧邮箱通过 → 继续输入新邮箱
        if (j.needNewEmail) {
          dmTitle.textContent = '更改邮箱';
          dmStep.textContent = '第 2 / 2 步 · 输入新邮箱';
          dmBody.innerHTML =
            '<p>' + esc(j.message || '当前邮箱已验证') + '</p>' +
            '<p class="small">验证码会发到这个新邮箱，验证通过后才会真正更换。</p>' +
            '<input type="email" id="emMail" placeholder="新的邮箱地址" autocomplete="email">' +
            '<input type="hidden" id="emPwd" value="x">';
          dmActs.innerHTML =
            '<button class="mute" id="emBack">返回</button>' +
            '<button id="emSend">发送验证码到新邮箱</button>';
          document.getElementById('emBack').onclick = function () { openEmailChangeOld(); };
          document.getElementById('emSend').onclick = function () {
            var mail = (document.getElementById('emMail') || {}).value || '';
            if (!mail.trim()) { setErr('请输入新邮箱'); return; }
            var b = document.getElementById('emSend');
            b.disabled = true;
            setErr('');
            emailPost({ action: 'change', step: 'new', email: mail.trim() },
              function (j2) { emailCodeStep('change', j2.message || '', '新邮箱验证码', '确认更改'); },
              function () { b.disabled = false; });
          };
          var m = document.getElementById('emMail');
          if (m) m.focus();
          return;
        }

        // 完成
        dmTitle.textContent = '完成';
        dmStep.textContent = '';
        dmBody.innerHTML = '<p>' + esc(j.message || '已完成') + '</p>';
        dmActs.innerHTML = '<button id="emDone">好</button>';
        document.getElementById('emDone').onclick = function () { closeModal(); loadMe(); };
        setTimeout(function () { closeModal(); loadMe(); }, 1800);
      })
      .catch(function () { setErr('网络错误'); if (btn) btn.disabled = false; });
  }

  /* ===================== 管理员：封禁（可设起止时间） ===================== */
  var banTarget = null;

  function toLocalMinute(ts) {
    var d = new Date(ts);
    return d.getFullYear() + '-' + p2(d.getMonth() + 1) + '-' + p2(d.getDate()) +
      'T' + p2(d.getHours()) + ':' + p2(d.getMinutes());
  }
  function parseLocalMinute(v) { return v ? new Date(v).getTime() : NaN; }

  function openBan(u) {
    banTarget = u;
    setErr('');
    dmTitle.textContent = '封禁账户';
    dmStep.textContent = u.username;
    var untilVal = u.banUntil ? toLocalMinute(u.banUntil) : '';
    dmBody.innerHTML =
      '<p>封禁后该账户无法下载，登录后会在所有页面看到 <b>You are banned</b>。</p>' +
      '<p class="small">「结束时间」留空就是<b>永久封禁</b>；填了就到期自动解封，不需要你再操作。</p>' +
      '<div class="m-field"><label>开始时间</label>' +
      '<input type="datetime-local" id="banFrom" value="' + toLocalMinute(Date.now()) + '"></div>' +
      '<div class="m-field"><label>结束时间（留空 = 永久）</label>' +
      '<input type="datetime-local" id="banUntil" value="' + untilVal + '"></div>' +
      '<div class="m-quick">' +
      '<button data-banq="1440">1 天</button>' +
      '<button data-banq="10080">7 天</button>' +
      '<button data-banq="43200">30 天</button>' +
      '<button data-banq="0">永久</button>' +
      '</div>';
    dmActs.innerHTML =
      '<button class="mute" id="banCancel">取消</button>' +
      '<button class="warn" id="banOk">确认封禁</button>';
    delMask.className = 'mask';
    document.getElementById('banCancel').onclick = closeModal;
    document.getElementById('banOk').onclick = doBan;
    dmBody.querySelectorAll('button[data-banq]').forEach(function (b) {
      b.onclick = function () {
        var mins = Number(b.dataset.banq);
        var el = document.getElementById('banUntil');
        el.value = mins > 0 ? toLocalMinute(Date.now() + mins * 60000) : '';
      };
    });
  }

  function doBan() {
    if (!banTarget) return;
    var from = parseLocalMinute(document.getElementById('banFrom').value);
    var untilRaw = document.getElementById('banUntil').value;
    var until = untilRaw ? parseLocalMinute(untilRaw) : 0;
    if (!isFinite(from)) { setErr('请选择开始时间'); return; }
    if (until && until <= Math.max(from, Date.now())) { setErr('结束时间必须晚于开始时间'); return; }

    var btn = document.getElementById('banOk');
    btn.disabled = true;
    setErr('');
    fetch('/api/admin/ban', {
      method: 'POST', headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ username: banTarget.username, banned: true, from: from, until: until || 0 }),
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { setErr(j.message || '封禁失败'); btn.disabled = false; return; }
        closeModal();
        note(j.message, true);
        loadAdmin();
      })
      .catch(function () { setErr('网络错误'); btn.disabled = false; });
  }

  /* ===================== 管理员：维护时间 ===================== */
  function renderMaintenance(m) {
    if (!m) m = { set: false, active: false };
    var now = Date.now();
    var status, color;
    if (!m.set) { status = '未设置（站点正常开放）'; color = '#7fa893'; }
    else if (m.active) { status = '维护中 —— 所有页面正在弹出维护提示'; color = '#ffb020'; }
    else if (now < m.start) { status = '已排期，将于 ' + fmtClock(m.start) + ' 自动开始'; color = '#ffcc00'; }
    else { status = '已结束'; color = '#7fa893'; }

    maintEl.innerHTML =
      '<div class="maint"><h2>维护时间</h2>' +
      '<div class="m-stat">当前状态：<b style="color:' + color + '">' + esc(status) + '</b>' +
      (m.set ? '<br>维护时段：' + fmtClock(m.start) + ' → ' + fmtClock(m.end) : '') +
      '</div>' +
      '<div class="m-field"><label>开始时间（到这个点，所有页面弹出维护弹窗）</label>' +
      '<input type="datetime-local" id="mStart" value="' + (m.set ? toLocalInput(m.start) : '') + '"></div>' +
      '<div class="m-field"><label>结束时间（到这个点，自动关闭维护弹窗）</label>' +
      '<input type="datetime-local" id="mEnd" value="' + (m.set ? toLocalInput(m.end) : '') + '"></div>' +
      '<div class="m-field"><label>本次维护访问密钥（给工作人员在维护期间预览用，可随时改；留空 = 不设）</label>' +
      '<input type="text" id="mKey" placeholder="' + (m.keySet ? '已设置 · 留空则沿用原密钥' : '例如 zrfeng-staff-2026') + '" autocomplete="off"></div>' +
      '<div class="m-stat" style="margin:6px 0 12px">' +
      (m.keySet
        ? '访问密钥：<b>已设置</b>（维护结束后自动销毁，密钥本身不会回显）'
        : '访问密钥：<b>未设置</b>（不设的话，维护期间谁都进不去）') +
      '</div>' +
      '<div class="m-quick">' +
      '<button data-quick="30">立即开始 · 30 分钟</button>' +
      '<button data-quick="60">立即开始 · 1 小时</button>' +
      '<button data-quick="120">立即开始 · 2 小时</button>' +
      '</div>' +
      '<div class="m-acts">' +
      '<button id="mSave">保存维护时间</button>' +
      '<button class="mute" id="mClear">清除维护时间</button>' +
      '</div>' +
      '<div class="msg" id="mMsg"></div>' +
      '<div class="m-now">本机当前时间：' + new Date().toLocaleString('zh-CN') + '</div>' +
      '</div>';

    document.getElementById('mSave').onclick = function () {
      var s = fromLocalInput(document.getElementById('mStart').value);
      var e = fromLocalInput(document.getElementById('mEnd').value);
      if (!isFinite(s) || !isFinite(e)) { mNote('请选择开始和结束时间', false); return; }
      if (e <= s) { mNote('结束时间必须晚于开始时间', false); return; }
      var keyEl = document.getElementById('mKey');
      var keyVal = keyEl ? keyEl.value.trim() : '';
      saveMaint({ start: s, end: e, key: keyVal, keepKey: !keyVal }, this);
    };
    document.getElementById('mClear').onclick = function () {
      saveMaint({ clear: true }, this);
    };
    maintEl.querySelectorAll('button[data-quick]').forEach(function (b) {
      b.onclick = function () {
        var mins = Number(b.dataset.quick);
        var s = Date.now();
        var kEl = document.getElementById('mKey');
        var kv = kEl ? kEl.value.trim() : '';
        saveMaint({ start: s, end: s + mins * 60000, key: kv, keepKey: !kv }, b);
      };
    });
  }

  function mNote(text, ok) {
    var el = document.getElementById('mMsg');
    if (!el) return;
    el.textContent = text;
    el.className = 'msg ' + (ok ? 'ok' : 'err');
  }

  function saveMaint(body, btn) {
    if (btn) btn.disabled = true;
    fetch('/api/admin/maintenance', {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
    })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        mNote(j.message || (j.ok ? '已保存' : '保存失败'), !!j.ok);
        if (j.ok) renderMaintenance(j.maintenance);
        else if (btn) btn.disabled = false;
      })
      .catch(function () { mNote('网络错误', false); if (btn) btn.disabled = false; });
  }

  function loadAdmin() {
    return fetch('/api/admin/users', { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) {
          noticesEl.innerHTML = '';
          maintEl.innerHTML = '';
          app.innerHTML = '';
          return;
        }
        renderNotices(j.notices);
        renderMaintenance(j.maintenance);
        renderUsers(j);
      })
      .catch(function () { /* 静默 */ });
  }

  /* ===================== 入口 ===================== */
  function loadMe() {
    return fetch('/api/me', { cache: 'no-store' })
    .then(function (r) { return r.json(); })
    .then(function (j) {
      if (!j.loggedIn) {
        who.textContent = '未登录';
        meEl.innerHTML = '<div class="card"><div class="center">请先<a href="/login/">登录</a>后再访问控制台。</div></div>';
        return;
      }
      ME = j;
      var u = j.user || {};
      who.textContent = u.isSuper
        ? '主管理员视图 · 可管理账户、设置管理员、维护时间'
        : (u.isAdmin
            ? '副管理员视图 · 可管理普通用户、设置维护时间（不能操作管理员账户）'
            : '账户视图 · 可查看状态与注销账户');
      renderMe(j);
      if (u.isAdmin) loadAdmin();
    })
    .catch(function () {
      who.textContent = '加载失败';
      meEl.innerHTML = '<div class="card"><div class="center">网络错误，请稍后重试。</div></div>';
    });
  }

  loadMe();
})();
</script>
  <script src="/status.js" defer></script>
</body>
</html>
