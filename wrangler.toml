name = "zrfeng"
compatibility_date = "2026-10-01"

# Worker 入口：提供 /api/* 接口（注册、登录、验证码、下载门控），
# 其余请求交给静态资源。
main = "worker.js"

[assets]
directory = "./"
binding = "ASSETS"
# 所有请求先过 Worker：除了 /api/*，还要靠它判断「美国 IP → /en_us/」的地区跳转
# 和 ?lang= 语种 Cookie。非 API 请求在 Worker 里直接 env.ASSETS.fetch(request)
# 原样转给静态资源，行为和以前一致，只是多一次函数调用。
run_worker_first = true

# ---------------------------------------------------------------------------
# KV 命名空间（存用户、会话、验证码）
#
# 注意：KV 的 id 不是密钥。它只是一个公开标识，真正操作它仍需 API Token，
# 所以放在这里（公开仓库）是安全的。真正的密钥见下方第 2 节。
# ---------------------------------------------------------------------------

[[kv_namespaces]]
binding = "USERS"
id = "fa1730e5c959430c82fc69708b68dba9"

# ---------------------------------------------------------------------------
# 密钥（不要把明文写进本文件，它会提交到公开仓库！）
# 请在 Cloudflare 后台「变量和机密」里逐条添加：
#
#      SESSION_SECRET     必填，任意长随机串（签名会话与验证码）
#      （站内下载文件不在这里配，由管理员用 /api/admin/novel 上传到 KV）
#      ADMIN_USERNAME     主管理员账户名（不设则不自动建号）
#      ADMIN_PASSWORD     主管理员密码
#      ADMIN_EMAIL        （可选）主管理员邮箱，可用邮箱登录
#      TRIAL_ACCOUNT      试用账户名（不设则不自动建号）
#      TRIAL_PASSWORD     试用账户密码
#      ADMIN_VERIFY_QUESTION  主管理员二次验证的问题（不配则不启用）
#      ADMIN_VERIFY_ANSWER    该问题的答案（务必只放密钥，不要写进代码或本文件）
#      RESEND_API_KEY     邮件服务密钥（真发验证码）
#      MAIL_FROM          发件人，如 "zrfeng.top <noreply@zrfeng.top>"
#      TURNSTILE_SECRET   （可选）Cloudflare 人机验证密钥
#      TURNSTILE_SITE_KEY （可选）配套的前端 site key
# ---------------------------------------------------------------------------
