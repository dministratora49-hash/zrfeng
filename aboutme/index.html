<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <script>/* 尽早落地亮/暗色主题，避免刷新时先闪一下深色（切换按钮在顶部状态栏里） */(function(){var t='dark';try{var s=localStorage.getItem('zrfeng-theme');if(s==='light'||s==='dark')t=s;}catch(e){}document.documentElement.setAttribute('data-theme',t);})();</script>
  <title>关于项目组 · zrfeng.top</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:"Microsoft YaHei","PingFang SC",sans-serif;
      background:linear-gradient(135deg,#0a101c 0%,#0d2818 100%);
      min-height:100vh; display:flex; align-items:center;
      justify-content:center; padding:20px; color:#e8f0f0;
    }
    .card {
      background:rgba(10,16,28,.92);
      border:1px solid rgba(0,255,170,.15);
      border-radius:16px; max-width:600px; width:100%;
      padding:32px 28px; box-shadow:0 0 40px rgba(0,255,170,.06);
    }
    header { text-align:center; margin-bottom:24px; }
    header h1 { color:#00ffaa; font-size:24px; margin-bottom:8px; }
    header p { color:#8899aa; font-size:13px; }
    p { line-height:1.9; font-size:15px; color:#cdd8d8; margin-bottom:14px; }
    .hl { color:#00ffaa; font-weight:600; }
    .logo { width:128px; height:128px; object-fit:cover; border-radius:22px; margin:0 auto 16px; display:block;
            border:1px solid rgba(0,255,170,.2); box-shadow:0 0 24px rgba(0,255,170,.10); }
    .team { color:#fff; font-size:20px; margin:0 0 10px; }
    .intro { color:#cdd8d8; }
    .team-sub { color:#8899aa; font-size:14px; margin:22px 0 10px; }
    .founder { width:88px; height:88px; object-fit:cover; border-radius:18px; margin:0 0 14px; display:block;
               border:1px solid rgba(0,255,170,.18); }
    .back { text-align:center; margin-top:28px; }
    .back a {
      display:inline-block; padding:10px 36px;
      border:1px solid rgba(0,255,170,.3); border-radius:24px;
      color:#00ffaa; text-decoration:none; font-size:14px;
      transition:all .2s;
    }
    .back a:hover { background:rgba(0,255,170,.08); }
    footer { text-align:center; color:#5a6a7a; font-size:12px;
             margin-top:20px; }
  </style>
<link rel="stylesheet" href="/theme.css">
</head>
<body>
  <div class="card">
    <header>
      <h1>关于项目组</h1>
      <p>About the Team</p>
      <img class="logo" src="/aboutme/logo.jpg" alt="宁静立方">
      <h2 class="team">宁静立方工作室</h2>
      <p class="intro">宁静立方工作室开发本网站，工作室已于 <span class="hl">2026年10月22日 18:15</span> 成立。</p>
      <h2 class="team-sub">关于工作室成立者</h2>
    </header>

    <img class="founder" src="/aboutme/founder.jpg" alt="工作室成立者">
    <p>我的网名是 <span class="hl">Summer</span>，是一位 <span class="hl">13岁</span> 的开发者，来自江苏。</p>

    <p>平时的时间大多被作业和补习班占着，但剩下的每一分钟，我喜欢写代码、研究航空、听洛天依——以及，折腾这个网站。</p>

    <p>你正在看的这个站，所有页面都是我用 <span class="hl">一台手机</span> 完成的：写代码、配DNS、部署上线，全程没有碰过电脑。</p>

    <p>如果它对你有一点点用处或启发，那这件小事就值得了。</p>

    <div class="back">
      <a href="https://www.zrfeng.top/guide/">← 返回导航页</a>
    </div>

    <footer>© 2026 zrfeng.top · 自然风，正在吹 🍃</footer>
  </div>
  <script src="/status.js" defer></script>
</body>
</html>
