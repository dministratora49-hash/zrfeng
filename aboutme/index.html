<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于开发者</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: #0a0f0d;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 60px 40px;
        }

        h1 {
            font-size: 34px;
            margin-bottom: 24px;
            background: linear-gradient(90deg, #00ff88, #00ccff);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 18px;
            line-height: 2;
            color: #c8d0cc;
        }

        .highlight {
            color: #00ff88;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <h1>关于开发者</h1>
    <p>
        我的网名是<span class="highlight">Summer</span>，我叫王培泽，是一位<span class="highlight">13岁</span>的开发者，一位<span class="highlight">江苏初中生</span>，没什么兴趣爱好，时间被作业和各种补习班充满。
    </p>
</body>
</html>
