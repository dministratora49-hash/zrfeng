<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于开发者</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            width: 100%;
            overflow: hidden;
        }

        header {
            background: #f7f8fc;
            padding: 32px;
            text-align: center;
            border-bottom: 1px solid #e8eaf3;
        }

        header h1 {
            font-size: 28px;
            color: #333;
        }

        header p {
            margin-top: 8px;
            color: #888;
            font-size: 14px;
        }

        main {
            padding: 40px 32px;
        }

        main p {
            font-size: 17px;
            line-height: 1.9;
            color: #444;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #aaa;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <div class="card">
        <header>
            <h1>关于开发者</h1>
            <p>About the Developer</p>
        </header>
        <main>
            <p>我叫王培泽，是一位13岁的开发者。</p>
        </main>
        <footer>© 2025 权利所有</footer>
    </div>
</body>
</html>
