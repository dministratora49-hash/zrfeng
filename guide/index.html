<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>导航页</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    background: #050807;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(0, 255, 140, 0.06) 0%, transparent 50%),
      radial-gradient(circle at 80% 80%, rgba(0, 255, 140, 0.05) 0%, transparent 50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
    padding: 80px 24px 24px;
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    color: #e8f5ee;
  }

  /* 网格背景 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,255,140,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,255,140,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  .top { position: relative; text-align: center; }

  h1 {
    font-size: 36px;
    margin-bottom: 32px;
    background: linear-gradient(90deg, #ffffff, #00ff8c);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  p.sub {
    color: #7fa893;
    font-size: 14px;
    margin-top: 36px;
    letter-spacing: 1px;
  }

  .btn {
    display: inline-block;
    padding: 14px 40px;
    font-size: 16px;
    color: #04140b;
    background: linear-gradient(135deg, #00ff8c, #00c86a);
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-decoration: none;
    font-weight: bold;
    letter-spacing: 2px;
    box-shadow: 0 0 20px rgba(0, 255, 140, 0.35);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  .btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 32px rgba(0, 255, 140, 0.6);
  }
  .btn:active { transform: translateY(0); }

  .bottom {
    position: relative;
    text-align: center;
    font-size: 12px;
    color: #4a6a58;
    line-height: 2;
    letter-spacing: 1px;
  }
</style>
</head>
<body>
  <div class="top">
    <h1>这里是导航页</h1>
    <a class="btn" href="https://www.zrfeng.top/aboutme">关于开发者</a>
    <p class="sub">欢迎访问，从这里开始你的旅程</p>
  </div>

  <div class="bottom">
    <div>zrfeng.top</div>
    <div>© 2026 zrfeng.top — All Rights Reserved</div>
  </div>
</body>
</html>
