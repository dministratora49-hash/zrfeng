<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京时间 · 同步阿里时间服务器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background: radial-gradient(circle at 20% 20%, #06120c 0%, #030805 60%, #010302 100%);
    color:#00e676;
    font-family:"Consolas","JetBrains Mono",monospace;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .card {
    border:1px solid rgba(0,230,118,.25);
    background:rgba(0,20,10,.55);
    border-radius:14px; padding:28px 22px;
    max-width:720px; width:100%;
    box-shadow:0 0 40px rgba(0,230,118,.12);
  }
  .badge { display:inline-block; border:1px solid rgba(0,230,118,.4); border-radius:20px;
    padding:4px 14px; font-size:12px; letter-spacing:2px; background:rgba(0,230,118,.08); }
  h1 { font-size:22px; margin:18px 0 6px; color:#e8ffe8; }
  .sub { font-size:12px; color:rgba(0,230,118,.6); margin-bottom:22px; }
  .big { font-size:clamp(38px,10vw,72px); color:#00ff88;
    text-shadow:0 0 18px rgba(0,255,136,.5); margin-bottom:8px;
    font-variant-numeric:tabular-nums; }
  .big small { font-size:.42em; color:rgba(0,255,136,.75); }
  .date { font-size:17px; color:#bdfccf; letter-spacing:3px; margin-bottom:22px; }
  .grid { display:flex; gap:8px; flex-wrap:wrap; }
  .cell { flex:1; min-width:74px; border:1px solid rgba(0,230,118,.25);
    background:rgba(0,30,15,.4); border-radius:8px; text-align:center; padding:10px 4px; }
  .cell .v { font-size:24px; color:#00ff88; font-variant-numeric:tabular-nums; }
  .cell .l { font-size:11px; color:rgba(0,230,118,.55); margin-top:4px; }
  .status { margin-top:18px; font-size:12px; color:rgba(0,230,118,.6); line-height:1.6;
    word-break:break-all; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#00ff88;
    box-shadow:0 0 8px #00ff88; margin-right:6px; animation:pulse 1.5s infinite; }
  .dot.red { background:#ff5555; box-shadow:0 0 8px #ff5555; }
  @keyframes pulse { 50% { opacity:.35; } }
</style>
</head>
<body>
<div class="card">
  <span class="badge">⏱ 北京时间（同步阿里时间服务器）</span>
  <h1>北京时间</h1>
  <div class="sub">UTC+8 · 启动时同步阿里时间服务器，含网络延迟补偿，每10分钟重校准</div>

  <div class="big" id="time">--:--:--<small>.0000</small></div>
  <div class="date" id="date">----年--月--日 星期-</div>

  <div class="grid">
    <div class="cell"><div class="v" id="y">----</div><div class="l">年</div></div>
    <div class="cell"><div class="v" id="mo">--</div><div class="l">月</div></div>
    <div class="cell"><div class="v" id="d">--</div><div class="l">日</div></div>
    <div class="cell"><div class="v" id="h">--</div><div class="l">时</div></div>
    <div class="cell"><div class="v" id="mi">--</div><div class="l">分</div></div>
    <div class="cell"><div class="v" id="s">--</div><div class="l">秒</div></div>
    <div class="cell"><div class="v" id="ms">.0000</div><div class="l">小数</div></div>
  </div>

  <div class="status">
    <span class="dot" id="dot"></span><span id="sync">正在同步阿里时间服务器…</span>
    <div id="detail" style="opacity:.7;margin-top:6px;"></div>
  </div>
</div>

<script>
let offset = 0;
const pad = (n,w=2)=>String(n).padStart(w,'0');
const $ = id => document.getElementById(id);
const week = ['日','一','二','三','四','五','六'];
let p = 0;

function jsonp(url, timeout=6000){
  return new Promise((res,rej)=>{
    const cb='_cb'+(++p), s=document.createElement('script');
    const t=setTimeout(()=>{done();rej('超时');},timeout);
    function done(){clearTimeout(t);delete window[cb];s.remove();}
    window[cb]=d=>{done();res(d);};
    s.onerror=()=>{done();rej('加载失败');};
    s.src=url+(url.includes('?')?'&':'?')+'callback='+cb;
    document.head.appendChild(s);
  });
}

function ok(msg){
  $('dot').classList.remove('red');
  $('sync').textContent = msg;
}
function fail(msg, detail){
  $('dot').classList.add('red');
  $('sync').textContent = msg;
  $('detail').textContent = detail;
}

async function syncTime(){
  const logs = [];

  // 通道1: 阿里时间服务器 JSONP
  try{
    const t0=Date.now();
    const j = await jsonp('https://acs.m.taobao.com/gw/mtop.common.getTimestamp/');
    const rtt=Date.now()-t0;
    offset = +j.data.t + rtt/2 - Date.now();
    ok(`✔ 已同步（阿里时间服务器）校准 ${offset.toFixed(1)}ms · 延迟 ${rtt}ms · 10分钟后重校`);
    $('detail').textContent='';
    return;
  }catch(e){ logs.push('阿里:'+e); }

  // 通道2: timeapi.io（阿里备用）
  try{
    const t0=Date.now();
    const r=await fetch('https://www.timeapi.io/api/Time/current/zone?timeZone=Asia/Shanghai',{cache:'no-store'});
    const j=await r.json();
    const rtt=Date.now()-t0;
    offset = new Date(j.dateTime+'Z').getTime() - 8*3600e3 + rtt/2 - Date.now();
    ok(`✔ 已同步（timeapi.io 备用）校准 ${offset.toFixed(1)}ms · 延迟 ${rtt}ms`);
    $('detail').textContent='';
    return;
  }catch(e){ logs.push('timeapi:'+e); }

  // 通道3: allorigins 代理转发阿里时间接口
  try{
    const t0=Date.now();
    const r=await fetch('https://api.allorigins.win/raw?url='+
      encodeURIComponent('https://acs.m.taobao.com/gw/mtop.common.getTimestamp/'),{cache:'no-store'});
    const j=await r.json();
    const rtt=Date.now()-t0;
    offset = +j.data.t + rtt/2 - Date.now();
    ok(`✔ 已同步（代理转发阿里）校准 ${offset.toFixed(1)}ms · 延迟 ${rtt}ms`);
    $('detail').textContent='';
    return;
  }catch(e){ logs.push('代理:'+e); }

  fail('⚠ 全部通道失败，暂用本机时间，30秒后重试', '失败详情: ' + logs.join(' | '));
  setTimeout(syncTime, 30000);
}
syncTime();
setInterval(syncTime, 10*60*1000);

function now(){ return Date.now() + offset; }

function render(){
  const d = new Date(now());
  const frac = (d.getMilliseconds()/1000).toFixed(4).slice(1);
  $('time').innerHTML = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}<small>${frac}</small>`;
  $('date').textContent = `${d.getFullYear()}年${pad(d.getMonth()+1)}月${pad(d.getDate())}日 星期${week[d.getDay()]}`;
  $('y').textContent  = d.getFullYear();
  $('mo').textContent = pad(d.getMonth()+1);
  $('d').textContent  = pad(d.getDate());
  $('h').textContent  = pad(d.getHours());
  $('mi').textContent = pad(d.getMinutes());
  $('s').textContent  = pad(d.getSeconds());
  $('ms').textContent = frac;
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
