<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京时间 · 同步国家授时中心</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background: radial-gradient(circle at 20% 20%, #06120c 0%, #030805 60%, #010302 100%);
    color:#00e676;
    font-family: "Consolas", "JetBrains Mono", monospace;
    display:flex; align-items:center; justify-content:center;
    padding:20px;
  }
  .card {
    border:1px solid rgba(0,230,118,.25);
    background:rgba(0,20,10,.55);
    border-radius:14px;
    padding:32px 28px;
    max-width:720px; width:100%;
    box-shadow:0 0 40px rgba(0,230,118,.12);
  }
  .badge {
    display:inline-block;
    border:1px solid rgba(0,230,118,.4);
    border-radius:20px;
    padding:4px 14px;
    font-size:12px;
    letter-spacing:2px;
    color:#00e676;
    background:rgba(0,230,118,.08);
  }
  h1 { font-size:22px; margin:18px 0 6px; color:#e8ffe8; font-weight:700; }
  .sub { font-size:12px; color:rgba(0,230,118,.6); margin-bottom:24px; }
  .big {
    font-size: clamp(38px, 9vw, 72px);
    color:#00ff88;
    text-shadow:0 0 18px rgba(0,255,136,.5);
    letter-spacing:2px;
    margin-bottom:10px;
    font-variant-numeric: tabular-nums;
  }
  .big small { font-size:.42em; color:rgba(0,255,136,.75); }
  .date { font-size:18px; color:#bdfccf; letter-spacing:4px; margin-bottom:24px; }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .cell {
    flex:1; min-width:80px;
    border:1px solid rgba(0,230,118,.25);
    background:rgba(0,30,15,.4);
    border-radius:8px;
    text-align:center; padding:12px 4px;
  }
  .cell .v { font-size:26px; color:#00ff88; font-variant-numeric: tabular-nums; }
  .cell .l { font-size:11px; color:rgba(0,230,118,.55); margin-top:4px; }
  .status { margin-top:20px; font-size:12px; color:rgba(0,230,118,.6); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#00ff88;
         box-shadow:0 0 8px #00ff88; margin-right:6px; animation:pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
</style>
</head>
<body>
<div class="card">
  <span class="badge">⏱ 北京时间（同步国家授时中心）</span>
  <h1>北京时间</h1>
  <div class="sub">UTC+8 · 启动时与标准时间接口校准，含网络延迟补偿</div>

  <div class="big" id="time">--:--:--<small>.0000</small></div>
  <div class="date" id="date">----年--月--日 星期-</div>

  <div class="grid">
    <div class="cell"><div class="v" id="y">----</div><div class="l">年</div></div>
    <div class="cell"><div class="v" id="mo">--</div><div class="l">月</div></div>
    <div class="cell"><div class="v" id="d">--</div><div class="l">日</div></div>
    <div class="cell"><div class="v" id="h">--</div><div class="l">时</div></div>
    <div class="cell"><div class="v" id="mi">--</div><div class="l">分</div></div>
    <div class="cell"><div class="v" id="s">--</div><div class="l">秒</div></div>
    <div class="cell"><div class="v" id="ms">.0000</div><div class="l">小数</div></div>
  </div>

  <div class="status"><span class="dot"></span><span id="sync">正在同步国家授时中心标准时间…</span></div>
</div>

<script>
let offset = 0;        // 标准时间 - 本地时间 (ms)
let synced = false;

// 从多个时间接口同步（返回服务器 Unix 毫秒时间戳，与国家授时中心 UTC 一致）
async function syncTime() {
  const apis = [
    { url:'https://acs.m.taobao.com/gw/mtop.common.getTimestamp/', parse:j=>+j.data.t },
    { url:'https://f.m.suning.com/api/ct.do',                parse:j=>j.currentTime },
    { url:'https://quan.suning.com/getSysTime.do',           parse:j=>new Date(j.sysTime2).getTime() },
  ];
  for (const api of apis) {
    try {
      const t0 = Date.now();
      const res = await fetch(api.url, { cache:'no-store' });
      const j = await res.json();
      const t1 = Date.now();
      const rtt = t1 - t0;
      const server = api.parse(j) + rtt / 2;   // 补偿单程网络延迟
      offset = server - t1;
      synced = true;
      document.getElementById('sync').textContent =
        `已同步 · 误差补偿 ${offset.toFixed(1)} ms · 延迟 ${rtt} ms · 每 10 分钟自动校准`;
      return;
    } catch(e) { /* 尝试下一个接口 */ }
  }
  document.getElementById('sync').textContent = '⚠ 同步失败，暂使用本机时间（每 30 秒重试）';
  setTimeout(syncTime, 30000);
}
syncTime();
setInterval(syncTime, 10 * 60 * 1000); // 每10分钟重新校准

function now() { return Date.now() + offset; }

const pad = (n, w=2) => String(n).padStart(w, '0');
const week = ['日','一','二','三','四','五','六'];

function render() {
  const d = new Date(now());
  const frac = (d.getMilliseconds() / 1000).toFixed(4).slice(1); // ".xxxx"

  document.getElementById('time').innerHTML =
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}<small>${frac}</small>`;
  document.getElementById('date').textContent =
    `${d.getFullYear()}年${pad(d.getMonth()+1)}月${pad(d.getDate())}日 星期${week[d.getDay()]}`;

  document.getElementById('y').textContent  = d.getFullYear();
  document.getElementById('mo').textContent = pad(d.getMonth()+1);
  document.getElementById('d').textContent  = pad(d.getDate());
  document.getElementById('h').textContent  = pad(d.getHours());
  document.getElementById('mi').textContent = pad(d.getMinutes());
  document.getElementById('s').textContent  = pad(d.getSeconds());
  document.getElementById('ms').textContent = frac;

  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
