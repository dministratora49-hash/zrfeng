<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>北京时间 · 同步阿里时间服务器</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    min-height:100vh;
    background: radial-gradient(circle at 20% 20%, #06120c 0%, #030805 60%, #010302 100%);
    color:#00e676;
    font-family:"Consolas","JetBrains Mono",monospace;
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .card { border:1px solid rgba(0,230,118,.25); background:rgba(0,20,10,.55);
    border-radius:14px; padding:32px 28px; max-width:720px; width:100%;
    box-shadow:0 0 40px rgba(0,230,118,.12); }
  .badge { display:inline-block; border:1px solid rgba(0,230,118,.4); border-radius:20px;
    padding:4px 14px; font-size:12px; letter-spacing:2px; background:rgba(0,230,118,.08); }
  h1 { font-size:22px; margin:18px 0 6px; color:#e8ffe8; }
  .sub { font-size:12px; color:rgba(0,230,118,.6); margin-bottom:24px; }
  .big { font-size:clamp(38px,9vw,72px); color:#00ff88; text-shadow:0 0 18px rgba(0,255,136,.5);
    margin-bottom:10px; font-variant-numeric:tabular-nums; }
  .big small { font-size:.42em; color:rgba(0,255,136,.75); }
  .date { font-size:18px; color:#bdfccf; letter-spacing:4px; margin-bottom:24px; }
  .grid { display:flex; gap:10px; flex-wrap:wrap; }
  .cell { flex:1; min-width:80px; border:1px solid rgba(0,230,118,.25);
    background:rgba(0,30,15,.4); border-radius:8px; text-align:center; padding:12px 4px; }
  .cell .v { font-size:26px; color:#00ff88; font-variant-numeric:tabular-nums; }
  .cell .l { font-size:11px; color:rgba(0,230,118,.55); margin-top:4px; }
  .status { margin-top:20px; font-size:12px; color:rgba(0,230,118,.6); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:#00ff88;
    box-shadow:0 0 8px #00ff88; margin-right:6px; animation:pulse 1.5s infinite; }
  @keyframes pulse { 50% { opacity:.35; } }
</style>
</head>
<body>
<div class="card">
  <span class="badge">⏱ 北京时间（同步国家授时中心）</span>
  <h1>北京时间</h1>
  <div class="sub">UTC+8 · JSONP 跨域同步标准时间，含延迟补偿</div>
  <div class="big" id="time">--:--:--<small>.0000</small></div>
  <div class="date" id="date">----年--月--日 星期-</div>
  <div class="grid">
    <div class="cell"><div class="v" id="y">----</div><div class="l">年</div></div>
    <div class="cell"><div class="v" id="mo">--</div><div class="l">月</div></div>
    <div class="cell"><div class="v" id="d">--</div><div class="l">日</div></div>
    <div class="cell"><div class="v" id="h">--</div><div class="l">时</div></div>
    <div class="cell"><div class="v" id="mi">--</div><div class="l">分</div></div>
    <div class="cell"><div class="v" id="s">--</div><div class="l">秒</div></div>
    <div class="cell"><div class="v" id="ms">.0000</div><div class="l">小数</div></div>
  </div>
  <div class="status"><span class="dot"></span><span id="sync">正在同步标准时间…</span></div>
</div>

<script>
let offset = 0, synced = false, p = 0;
const pad = (n,w=2)=>String(n).padStart(w,'0');
const setStatus = t => document.getElementById('sync').textContent = t;

// JSONP：不受 CORS 限制
function jsonp(url, timeout=5000) {
  return new Promise((resolve, reject) => {
    const cb = '_cb' + (++p);
    const s = document.createElement('script');
    const timer = setTimeout(()=>{ cleanup(); reject('timeout'); }, timeout);
    function cleanup(){ clearTimeout(timer); delete window[cb]; s.remove(); }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject('error'); };
    s.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + cb;
    document.head.appendChild(s);
  });
}

async function syncTime() {
  // 淘宝 JSONP 接口（稳定，返回服务器毫秒时间戳）
  try {
    const t0 = Date.now();
    const j = await jsonp('https://acs.m.taobao.com/gw/mtop.common.getTimestamp/');
    const rtt = Date.now() - t0;
    offset = (+j.data.t) + rtt/2 - Date.now();
    synced = true;
    setStatus(`✔ 已同步（淘宝标准时间）· 校准 ${offset.toFixed(1)} ms · 延迟 ${rtt} ms · 10分钟后再校准`);
    return;
  } catch(e) {}

  // 兜底：worldtimeapi
  try {
    const t0 = Date.now();
    const res = await fetch('https://worldtimeapi.org/api/timezone/Asia/Shanghai');
    const rtt = Date.now() - t0;
    const j = await res.json();
    offset = new Date(j.utc_datetime).getTime() + rtt/2 - Date.now();
    synced = true;
    setStatus(`✔ 已同步（worldtimeapi）· 校准 ${offset.toFixed(1)} ms · 10分钟后再校准`);
    return;
  } catch(e) {}

  // 再兜底：通过图片响应头方式请求京东时间页不可行，改用本机时间
  setStatus('⚠ 同步失败，暂用本机时间，30秒后重试…（请检查网络/关闭广告拦截）');
  setTimeout(syncTime, 30000);
}
syncTime();
setInterval(syncTime, 10*60*1000);

function now(){ return Date.now() + offset; }
const week = ['日','一','二','三','四','五','六'];

function render(){
  const d = new Date(now());
  const frac = (d.getMilliseconds()/1000).toFixed(4).slice(1);
  document.getElementById('time').innerHTML =
    `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}<small>${frac}</small>`;
  document.getElementById('date').textContent =
    `${d.getFullYear()}年${pad(d.getMonth()+1)}月${pad(d.getDate())}日 星期${week[d.getDay()]}`;
  document.getElementById('y').textContent  = d.getFullYear();
  document.getElementById('mo').textContent = pad(d.getMonth()+1);
  document.getElementById('d').textContent  = pad(d.getDate());
  document.getElementById('h').textContent  = pad(d.getHours());
  document.getElementById('mi').textContent = pad(d.getMinutes());
  document.getElementById('s').textContent  = pad(d.getSeconds());
  document.getElementById('ms').textContent = frac;
  requestAnimationFrame(render);
}
render();
</script>
</body>
</html>
